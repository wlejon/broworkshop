<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proc Watch</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>procwatch</h1>
    <span class="k-sub">leftover processes, system load, and an auto-reaper for the tools agents leave running</span>
  </header>
  <div class="k-toolbar">
    <label class="k-chip"><input type="checkbox" id="f-unix"> unix tools</label>
    <label class="k-chip"><input type="checkbox" id="f-ddrive"> from D:</label>
    <label class="k-chip"><input type="checkbox" id="f-other"> everything else</label>
    <label class="k-chip"><input type="checkbox" id="f-orphans"> orphans only</label>
    <input type="text" id="q" placeholder="search pid / name / command line…">
    <div class="k-spacer"></div>
    <button id="kill-shown" class="danger">kill shown</button>
  </div>

  <section id="gauges" class="k-toolbar">
    <div class="gauge">
      <div class="g-head"><span class="g-label">cpu</span><span class="g-val" id="cpu-val">–</span></div>
      <canvas id="cpu-spark"></canvas>
      <canvas id="cpu-cores"></canvas>
    </div>
    <div class="gauge">
      <div class="g-head"><span class="g-label">ram</span><span class="g-val" id="ram-val">–</span></div>
      <span class="k-meter block" id="ram-bar"></span>
      <div class="g-sub" id="ram-sub"></div>
    </div>
    <div id="gpus" class="k-row"></div>
  </section>

  <div id="reaper" class="k-toolbar">
    <label class="k-chip hot"><input type="checkbox" id="reap-on"> auto-kill</label>
    <label class="k-chip"><input type="checkbox" id="reap-orphans"> orphans only</label>
    <label class="k-field">older than <input type="number" id="reap-secs" min="5" step="5"> s</label>
    <label class="k-field k-grow">names <input type="text" id="reap-names" class="k-grow"></label>
    <span id="reap-log" class="warn"></span>
  </div>

  <main class="k-main" id="main">
    <div class="row head" id="thead">
      <span class="c-name" data-sort="name">process</span>
      <span class="c-pid">pid</span>
      <span class="c-cpu sorted" data-sort="cpu">cpu</span>
      <span class="c-mem" data-sort="mem">mem</span>
      <span class="c-age" data-sort="age">age</span>
      <span class="c-cmd">command</span>
      <span class="c-kill"></span>
    </div>
    <div id="rows">
      <div id="tbody"></div>
      <div id="empty" class="dim" hidden>nothing matches: agents are behaving, for once</div>
      <p class="k-note" id="hint">click a row for details and actions: kill, kill tree, open folder, copy command, auto-kill by name</p>
    </div>
  </main>

  <footer class="k-statusbar"><span id="status">scanning…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
