<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="appWrapper">
        <!-- Top Toolbar -->
        <div id="topBar">
            <div class="brand-section">
                <span class="brand-title">🧠 NEURAL PLAYGROUND</span>
                <span class="badge-gpu" id="backendBadge">bro.tensor</span>
            </div>

            <!-- Dataset Selectors -->
            <div class="dataset-picker">
                <button class="btn-ds active" data-dataset="spiral">Spiral</button>
                <button class="btn-ds" data-dataset="circles">Circles</button>
                <button class="btn-ds" data-dataset="xor">XOR</button>
                <button class="btn-ds" data-dataset="clusters">Clusters</button>
            </div>

            <!-- Training Playback -->
            <div class="playback-controls">
                <button id="btnPlay" class="btn-play">▶ TRAIN</button>
                <button id="btnStep" class="btn-icon" title="Step One Epoch">⏭ Step</button>
                <button id="btnReset" class="btn-icon" title="Reset Network Weights">↺ Reset</button>
            </div>
        </div>

        <!-- 3-Column Studio Layout -->
        <div id="dashboard">
            <!-- Left Column: Controls & Metrics -->
            <div class="col-panel">
                <div class="panel-header">Hyperparameters</div>

                <div class="control-card">
                    <div class="param-row">
                        <span class="param-label">Learning Rate</span>
                        <div class="param-input">
                            <select id="selLr">
                                <option value="0.001">0.001</option>
                                <option value="0.005">0.005</option>
                                <option value="0.01">0.01</option>
                                <option value="0.03" selected>0.03</option>
                                <option value="0.1">0.1</option>
                                <option value="0.3">0.3</option>
                            </select>
                        </div>
                    </div>

                    <div class="param-row">
                        <span class="param-label">Activation</span>
                        <div class="param-input">
                            <select id="selActivation">
                                <option value="tanh" selected>Tanh</option>
                                <option value="relu">ReLU</option>
                                <option value="silu">SiLU</option>
                                <option value="sigmoid">Sigmoid</option>
                            </select>
                        </div>
                    </div>

                    <div class="param-row">
                        <span class="param-label">Optimizer</span>
                        <div class="param-input">
                            <select id="selOptimizer">
                                <option value="adam" selected>Adam</option>
                                <option value="adamw">AdamW</option>
                                <option value="sgd">SGD (Momentum)</option>
                            </select>
                        </div>
                    </div>

                    <div class="param-row">
                        <span class="param-label">Batch Size</span>
                        <div class="param-input">
                            <select id="selBatchSize">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="0">Full Batch</option>
                            </select>
                        </div>
                    </div>

                    <div class="param-row">
                        <span class="param-label">Weight Decay</span>
                        <div class="param-input">
                            <select id="selDecay">
                                <option value="0">None</option>
                                <option value="0.0001" selected>0.0001</option>
                                <option value="0.001">0.001</option>
                                <option value="0.01">0.01</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="panel-header">Dataset Properties</div>
                <div class="control-card">
                    <div class="param-row">
                        <span class="param-label">Noise: <b id="lblNoise">10%</b></span>
                    </div>
                    <input type="range" id="sliderNoise" class="param-slider" min="0" max="0.5" step="0.02" value="0.10">

                    <div class="param-row" style="margin-top: 10px;">
                        <span class="param-label">Samples: <b id="lblSamples">250</b></span>
                    </div>
                    <input type="range" id="sliderSamples" class="param-slider" min="60" max="500" step="20" value="250">
                </div>

                <div class="panel-header">Telemetry Metrics</div>
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-title">Epoch</div>
                        <div class="metric-val" id="metricEpoch">0</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Train Loss</div>
                        <div class="metric-val" id="metricTrainLoss">0.000</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Test Loss</div>
                        <div class="metric-val" id="metricTestLoss">0.000</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Test Accuracy</div>
                        <div class="metric-val" id="metricAccuracy" style="color: #00ffaa;">0.0%</div>
                    </div>
                </div>
            </div>

            <!-- Center Column: Decision Boundary Heatmap & Loss Curves -->
            <div class="col-panel">
                <div class="panel-header">
                    <span>2D Decision Boundary</span>
                    <span style="font-size: 10px; color: #64748b;">Grid 50x50</span>
                </div>
                <canvas id="boundaryCanvas" width="388" height="360"></canvas>

                <div class="panel-header">Loss Curves</div>
                <canvas id="lossCanvas" width="388" height="220"></canvas>
            </div>

            <!-- Right Column: Network Architecture Diagram & Layer Editor -->
            <div class="col-panel">
                <div class="panel-header">
                    <span>Network Architecture</span>
                    <div class="arch-toolbar">
                        <button id="btnAddLayer" class="btn-arch">+ Add Layer</button>
                        <button id="btnRemoveLayer" class="btn-arch">- Remove Layer</button>
                    </div>
                </div>

                <div class="layer-chips-container" id="layerChips">
                    <!-- Dynamically populated layer neuron control chips -->
                </div>

                <canvas id="networkCanvas" width="550" height="520"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
