<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Playground</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
    <header class="k-header">
        <h1>Neural Playground</h1>
        <span class="k-badge ok" id="backend-badge">—</span>
        <span class="k-sub">a small MLP learning a 2D decision boundary · <b>space</b> train / pause</span>
    </header>

    <div class="k-toolbar">
        <div class="k-row" id="datasets"></div>
        <span class="k-sep"></span>
        <button id="btn-play" class="np-play">▶ Train</button>
        <button id="btn-step" title="Train one epoch">⏭ Step</button>
        <button id="btn-reset" title="Re-initialise the weights">↺ Reset</button>
    </div>

    <div class="k-body">
        <aside class="k-side">
            <div class="k-panel"><h2>Hyperparameters</h2><div class="k-col" id="hyper"></div></div>
            <div class="k-panel"><h2>Dataset</h2><div class="k-col" id="data-params"></div></div>
            <div class="k-panel"><h2>Metrics</h2><div id="metrics"></div></div>
        </aside>

        <main class="k-main pad np-main">
            <section class="np-col">
                <div class="k-caption">Decision boundary <span class="dim">grid 50×50 · filled = train, ringed = test</span></div>
                <canvas id="boundary" class="np-boundary"></canvas>
                <div class="k-caption">Loss curves</div>
                <canvas id="loss" class="np-loss"></canvas>
            </section>
            <section class="np-col np-grow">
                <div class="k-row">
                    <div class="k-caption">Network architecture</div>
                    <span class="k-spacer"></span>
                    <button class="small" id="btn-add-layer">+ Add layer</button>
                    <button class="small" id="btn-remove-layer">− Remove layer</button>
                </div>
                <div class="k-row" id="layer-chips"></div>
                <canvas id="network" class="np-network"></canvas>
            </section>
        </main>
    </div>

    <footer class="k-statusbar"><span id="status"></span></footer>

    <script type="module" src="/app/main.js"></script>
</body>
</html>
