<!DOCTYPE html>
<html>
<head>
    <title>Synth</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
    <header class="k-header">
        <h1>Synth</h1>
        <nav class="k-tabs" id="views">
            <button data-tab="synth" class="active">Synth</button>
            <button data-tab="editor">Clip Editor</button>
        </nav>
        <span class="k-spacer"></span>
        <label class="k-field">preset <select id="preset"></select></label>
        <button id="preset-save" class="small" title="save the selected sound as a user preset">save</button>
        <button id="preset-del" class="small danger" title="delete this user preset">del</button>
        <span class="k-sep"></span>
        <button id="undo" class="small" title="Ctrl+Z">undo</button>
        <button id="redo" class="small" title="Ctrl+Y">redo</button>
        <span class="k-sep"></span>
        <label class="k-field">vol <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5"></label>
        <button id="mic" class="small" title="monitor the microphone through its own effect bus">mic</button>
        <span id="mic-meter"></span>
        <input type="range" id="mic-volume" min="0" max="1" step="0.01" value="0.5" title="mic monitor level">
        <label class="k-field" id="midi-field">midi <select id="midi-port"></select></label>
    </header>

    <!-- ============================== synth view ============================== -->
    <div class="k-body" data-pane="synth">
        <aside class="k-side" id="sidebar"></aside>
        <main class="k-main">
            <div id="scopes"></div>
            <div class="k-toolbar" id="seqbar">
                <button id="seq-play" class="primary">play</button>
                <button id="seq-rec" title="record the output mix to a WAV file">rec</button>
                <label class="k-field">bpm <input type="range" id="bpm" min="30" max="300" step="1" value="120"><span class="k-val" id="bpm-val"></span></label>
                <span class="k-sep"></span>
                <span id="seq-mode"></span>
                <span id="arp-pattern"></span>
                <span class="k-spacer"></span>
                <button id="save-loop" title="render one loop offline to a WAV file">save loop</button>
                <button id="layer-add">+ layer</button>
            </div>
            <div id="grid"></div>
        </main>
    </div>

    <!-- ============================== clip editor ============================= -->
    <div class="k-body" data-pane="editor" hidden>
        <main class="k-main">
            <div class="k-toolbar" id="ed-toolbar">
                <button id="ed-record" title="record the output mix into the clip">rec</button>
                <button id="ed-load">load</button>
                <button id="ed-save">save</button>
                <span class="k-sep"></span>
                <button id="ed-toggle">play</button>
                <input type="range" id="ed-seek" min="0" max="1000" value="0">
                <span id="ed-time" class="k-val"></span>
                <button id="ed-loop">loop</button>
                <span class="k-sep"></span>
                <button id="ed-undo" class="small">undo</button>
                <button id="ed-redo" class="small">redo</button>
                <span class="k-sep"></span>
                <button id="ed-cut" class="small">cut</button>
                <button id="ed-copy" class="small">copy</button>
                <button id="ed-paste" class="small">paste</button>
                <button id="ed-delete" class="small">del</button>
                <button id="ed-silence" class="small">silence</button>
                <button id="ed-trim" class="small">trim</button>
                <button id="ed-select-all" class="small">all</button>
                <span class="k-sep"></span>
                <button id="ed-zoom-in" class="small">zoom +</button>
                <button id="ed-zoom-out" class="small">zoom -</button>
                <button id="ed-zoom-fit" class="small">fit</button>
                <button id="ed-zoom-sel" class="small">sel</button>
                <span id="ed-zoom" class="k-val"></span>
                <span id="ed-cursor" class="k-val"></span>
            </div>
            <div class="k-viewport"><canvas id="ed-canvas"></canvas></div>
        </main>
        <aside class="k-side right">
            <div class="k-panel">
                <h2>Process</h2>
                <div class="k-row">
                    <button id="ed-normalize" class="small">normalize</button>
                    <button id="ed-reverse" class="small">reverse</button>
                    <button id="ed-fade-in" class="small">fade in</button>
                    <button id="ed-fade-out" class="small">fade out</button>
                </div>
                <label class="k-field"><span>gain</span><input type="range" id="ed-gain" min="-24" max="24" step="1" value="0"><span class="k-val" id="ed-gain-val"></span></label>
                <button id="ed-gain-apply" class="small">apply gain</button>
            </div>
            <div class="k-panel">
                <h2>Pitch</h2>
                <label class="k-field"><span>semitones</span><input type="range" id="ed-pitch" min="-24" max="24" step="1" value="0"><span class="k-val" id="ed-pitch-val"></span></label>
                <div class="k-row">
                    <button id="ed-pitch-apply" class="small">apply</button>
                    <button class="small" data-semi="-12">-oct</button>
                    <button class="small" data-semi="-1">-1</button>
                    <button class="small" data-semi="1">+1</button>
                    <button class="small" data-semi="12">+oct</button>
                </div>
            </div>
            <div class="k-panel">
                <h2>Time</h2>
                <label class="k-field"><span>speed</span><input type="range" id="ed-speed" min="25" max="400" step="1" value="100"><span class="k-val" id="ed-speed-val"></span></label>
                <div class="k-row">
                    <button id="ed-speed-apply" class="small">apply</button>
                    <button class="small" data-speed="50">50%</button>
                    <button class="small" data-speed="75">75%</button>
                    <button class="small" data-speed="150">150%</button>
                    <button class="small" data-speed="200">200%</button>
                </div>
            </div>
            <div class="k-panel">
                <h2>Insert</h2>
                <label class="k-field"><span>silence</span><input type="range" id="ed-silence-dur" min="10" max="5000" step="10" value="500"><span class="k-val" id="ed-silence-dur-val"></span></label>
                <button id="ed-insert-silence" class="small">insert silence</button>
            </div>
            <div class="k-panel">
                <h2>Generate</h2>
                <label class="k-field"><span>freq</span><input type="range" id="ed-gen-freq" min="20" max="2000" step="1" value="440"><span class="k-val" id="ed-gen-freq-val"></span></label>
                <label class="k-field"><span>length</span><input type="range" id="ed-gen-dur" min="50" max="5000" step="10" value="1000"><span class="k-val" id="ed-gen-dur-val"></span></label>
                <div id="ed-gen-wave"></div>
                <div class="k-row">
                    <button id="ed-generate" class="small">tone</button>
                    <button id="ed-gen-noise" class="small">white noise</button>
                </div>
            </div>
            <div class="k-panel">
                <h2>Instrument</h2>
                <p class="k-note">Play the clip from the keyboard, pitched from C4.</p>
                <div class="k-row">
                    <button id="ed-use-clip" class="small">use as instrument</button>
                    <button id="ed-clear-clip" class="small">oscillators</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- piano, shared by both views -->
    <div id="piano-wrap">
        <div id="piano"></div>
        <div id="octave">
            <span class="dim">shift+tab</span>
            <b id="octave-name">C3</b>
            <span class="dim">tab</span>
        </div>
    </div>

    <footer class="k-statusbar">
        <span id="status"></span>
        <span class="k-spacer"></span>
        <span class="k-stats" id="stats"></span>
    </footer>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
