<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Desktop Notebook</title>
  <link rel="stylesheet" href="/lib/kit/kit.css">
  <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Notebook</h1>
    <span class="k-sub">Markdown notes · live preview</span>
    <span class="k-spacer"></span>
    <label class="k-field">theme
      <select id="themeSelector">
        <option value="dark">Dark Slate</option>
        <option value="light">Light Paper</option>
        <option value="sepia">Warm Sepia</option>
        <option value="obsidian">Obsidian Cyber</option>
      </select>
    </label>
    <button id="btnPinWindow" class="k-chip" title="Always on top">Pin</button>
    <button id="btnMinWindow" title="Minimize window">Minimize</button>
  </header>

  <div class="k-body">
    <aside id="sidebar" class="k-side">
      <input type="text" id="docSearchInput" placeholder="Search notes…">
      <button id="btnNewNote" class="primary">+ New Note</button>
      <div id="docList" class="k-col"></div>
    </aside>

    <main class="k-main">
      <div class="k-toolbar" id="ribbon">
        <button data-wrap="**|bold text" title="Bold"><b>B</b></button>
        <button data-wrap="*|italic text" title="Italic"><i>I</i></button>
        <button data-wrap="~~|strikethrough" title="Strikethrough"><s>S</s></button>
        <button data-wrap="`|code" title="Inline code">&lt;/&gt;</button>
        <span class="k-sep"></span>
        <button data-heading="1" title="Heading 1">H1</button>
        <button data-heading="2" title="Heading 2">H2</button>
        <button data-heading="3" title="Heading 3">H3</button>
        <span class="k-sep"></span>
        <button data-block="ul" title="Bullet list">• List</button>
        <button data-block="ol" title="Numbered list">1. List</button>
        <button data-block="task" title="Task list">Task</button>
        <button data-block="quote" title="Blockquote">Quote</button>
        <button data-block="table" title="Table">Table</button>
        <button data-block="code" title="Fenced code block">Code</button>
        <button data-block="hr" title="Horizontal rule">Rule</button>
        <span class="k-sep"></span>
        <button data-cmd="edit.find" id="btnToggleFindBar" title="Find & Replace (Ctrl+F)">Find</button>
      </div>

      <div class="k-toolbar" id="findBar" hidden>
        <input type="text" id="findInput" placeholder="Find…">
        <input type="text" id="replaceInput" placeholder="Replace with…">
        <button id="btnFindNext">Next</button>
        <button id="btnReplace">Replace</button>
        <button id="btnReplaceAll">All</button>
        <span id="findMatchCount" class="dim">0 matches</span>
        <span class="k-spacer"></span>
        <button id="btnCloseFind" title="Close">✕</button>
      </div>

      <div class="split-pane" id="splitPane">
        <div class="editor-pane" id="editorPane">
          <div class="line-gutter" id="lineGutter"><div>1</div></div>
          <textarea id="editorTextarea" placeholder="Write your markdown note here…" spellcheck="false"></textarea>
        </div>
        <div class="split-handle" id="splitHandle"></div>
        <div class="preview-pane" id="previewPane"></div>
      </div>
    </main>
  </div>

  <footer class="k-statusbar">
    <b id="statusDocTitle">Untitled Note</b>
    <span id="statusSaveState" class="ok">Saved</span>
    <span id="statusCursorPos">Ln 1, Col 1</span>
    <span id="status"></span>
    <span class="k-spacer"></span>
    <span id="statusWordCount">0 words</span>
    <span id="statusCharCount">0 chars</span>
    <span id="statusReadTime">1 min read</span>
    <span id="statusZoom">100%</span>
    <span id="viewModes" class="k-row">
      <button class="k-chip" data-mode="split" title="Split view (Ctrl+1)">Split</button>
      <button class="k-chip" data-mode="editor" title="Editor only (Ctrl+2)">Editor</button>
      <button class="k-chip" data-mode="preview" title="Preview only (Ctrl+3)">Preview</button>
    </span>
  </footer>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
