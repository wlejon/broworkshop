<!DOCTYPE html>
<html>
<head>
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
    <div class="k-body">
        <aside class="k-side av-nav">
            <div class="av-brand">algo-viz</div>
            <nav id="viz-list"></nav>
            <div class="k-note">Algorithms run in C++ via bro bindings; the visualisation is JS.</div>
        </aside>
        <main class="k-main">
            <header class="k-header av-head">
                <h1 id="title">—</h1>
                <span class="k-sub" id="subtitle"></span>
            </header>
            <div class="k-toolbar" id="params"></div>
            <div class="k-viewport" id="stage"></div>
            <footer class="k-statusbar"><span id="status"></span></footer>
        </main>
    </div>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
