<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reader</title>
  <link rel="stylesheet" href="/lib/kit/kit.css">
  <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Reader</h1>
    <span class="k-sub">local text-to-speech reading</span>
    <span class="k-spacer"></span>
    <span id="backend" class="k-badge">idle</span>
    <button id="btn-settings" title="Settings">Settings</button>
  </header>

  <!-- library -->
  <div id="library-view" class="k-body view">
    <main class="k-main">
      <div class="k-toolbar">
        <button id="btn-import" class="primary">+ Import document…</button>
        <span class="dim">txt · md · html, or drop files anywhere</span>
      </div>
      <div id="lib-scroll">
        <div id="lib-empty">
          <div class="empty-title">Your library is empty.</div>
          <div class="dim">Import a .txt, .md or .html document to start listening.</div>
        </div>
        <div id="doc-grid"></div>
      </div>
    </main>
  </div>

  <!-- reader -->
  <div id="reader-view" class="k-body view" hidden>
    <main class="k-main">
      <div class="k-toolbar" id="reader-head">
        <button id="btn-back">← Library</button>
        <span id="doc-title"></span>
        <span class="k-spacer"></span>
        <label class="k-field">engine
          <select id="engine-sel">
            <option value="kokoro">Kokoro</option>
            <option value="qwen">Qwen3-TTS</option>
          </select>
        </label>
        <label class="k-field">voice <select id="voice-sel"></select></label>
        <button id="btn-preview" title="Preview this voice">Preview</button>
        <label class="k-field">speed
          <select id="speed-sel">
            <option value="0.7">0.7×</option>
            <option value="0.85">0.85×</option>
            <option value="1" selected>1×</option>
            <option value="1.15">1.15×</option>
            <option value="1.3">1.3×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>

      <div id="reader-scroll"><div id="reader-text"></div></div>

      <div class="k-toolbar" id="player-bar">
        <button id="btn-para" title="Start of paragraph (↑)">¶</button>
        <button id="btn-prev" title="Previous sentence (←)">◀◀</button>
        <button id="btn-play" class="primary playbtn" title="Play (space)">▶</button>
        <button id="btn-next" title="Next sentence (→)">▶▶</button>
        <span id="progress" class="dim"></span>
        <span class="k-spacer"></span>
        <label class="k-field">sleep
          <select id="sleep-sel">
            <option value="off" selected>off</option>
            <option value="5">5 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">60 min</option>
            <option value="para">end of ¶</option>
          </select>
        </label>
        <span id="sleep-meta" class="dim"></span>
        <button id="btn-export" title="Export narration from here to a WAV file">Export WAV</button>
      </div>
    </main>
  </div>

  <footer class="k-statusbar"><span id="status"></span></footer>

  <!-- settings dialog -->
  <div id="settings-modal" class="modal" hidden>
    <div class="k-panel dialog">
      <h2>Settings <span class="k-spacer"></span><button id="btn-settings-close">✕</button></h2>
      <label class="k-field"><span>theme</span>
        <select id="set-theme"><option value="dark">dark</option><option value="light">light</option></select>
      </label>
      <label class="k-field"><span>text size</span>
        <input id="set-fontsize" type="range" min="14" max="30" step="1"><span id="set-fontsize-val" class="k-val"></span>
      </label>
      <label class="k-field"><span>default engine</span>
        <select id="set-engine"><option value="kokoro">Kokoro</option><option value="qwen">Qwen3-TTS</option></select>
      </label>
      <label class="k-field"><span>default voice (Kokoro)</span> <select id="set-voice"></select></label>
      <label class="k-field"><span>default speed</span>
        <select id="set-speed">
          <option value="0.7">0.7×</option><option value="0.85">0.85×</option>
          <option value="1">1×</option><option value="1.15">1.15×</option>
          <option value="1.3">1.3×</option><option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option><option value="2">2×</option>
        </select>
      </label>
      <label class="k-field"><span>weights root</span>
        <input id="set-dataroot" type="text" placeholder="(auto-detect brosoundml)">
        <button id="btn-browse-root" title="Choose the brosoundml / brosoundml-data folder">Browse…</button>
      </label>
      <pre id="set-paths" class="dim"></pre>
    </div>
  </div>

  <!-- export progress dialog -->
  <div id="export-modal" class="modal" hidden>
    <div class="k-panel dialog">
      <h2>Exporting narration</h2>
      <div id="export-bar" class="k-progress"></div>
      <div id="export-status" class="dim">…</div>
      <div class="k-row end"><button id="btn-export-cancel" class="danger">Cancel</button></div>
    </div>
  </div>

  <div id="drop-overlay" hidden><div class="drop-box">Drop documents to import</div></div>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
