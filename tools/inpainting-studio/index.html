<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inpainting Studio</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Inpainting Studio</h1>
    <span class="k-sub">mask · outpaint · ControlNet over Stable Diffusion 1.5</span>
    <span class="k-spacer"></span>
    <span id="backend"></span>
  </header>
  <div class="k-body">
    <aside class="k-side">
      <div class="k-panel">
        <h2>image</h2>
        <label class="k-field"><span>scene</span><select id="presetSelect"></select></label>
        <button id="uploadImgBtn">Open image…</button>
        <button id="btn-adopt" disabled title="make the result the new base image">Use result as base</button>
      </div>
      <div class="k-panel">
        <h2>mask brush</h2>
        <div class="k-row" id="tool"></div>
        <label class="k-field"><span>size</span><input type="range" id="brushSize" min="4" max="128" value="32"><span class="k-val" id="brushSizeVal">32px</span></label>
        <label class="k-field"><span>hardness</span><input type="range" id="brushHardness" min="0" max="100" value="80"><span class="k-val" id="brushHardnessVal">80%</span></label>
        <div class="k-row">
          <button class="small" id="invertMaskBtn">Invert</button>
          <button class="small" id="clearMaskBtn">Clear</button>
          <button class="small" id="fillMaskBtn">Fill all</button>
        </div>
      </div>
      <div class="k-panel">
        <h2>outpaint</h2>
        <div class="expand">
          <button class="small n" data-expand="n">▲ 64</button>
          <button class="small w" data-expand="w">◀ 64</button>
          <button class="small e" data-expand="e">64 ▶</button>
          <button class="small s" data-expand="s">▼ 64</button>
        </div>
        <p class="k-note">Grows the canvas; the new border is masked for repaint.</p>
      </div>
    </aside>
    <main class="k-main">
      <div class="k-toolbar"><span class="k-cap">view</span><div class="k-row" id="views"></div></div>
      <div class="k-viewport" id="viewport">
        <div id="stage">
          <canvas id="baseCanvas" width="512" height="512"></canvas>
          <canvas id="maskCanvas" width="512" height="512"></canvas>
          <canvas id="controlCanvas" width="512" height="512"></canvas>
          <canvas id="resultCanvas" width="512" height="512"></canvas>
        </div>
        <div class="k-hint" id="result-hint" hidden>No result yet: load a model, then Generate.</div>
      </div>
      <div class="k-toolbar" id="run"></div>
      <div class="k-toolbar bare" id="gallery"></div>
    </main>
    <aside class="k-side right">
      <div class="k-panel">
        <h2>model</h2>
        <div id="model"></div>
        <p class="k-note" id="model-meta"></p>
      </div>
      <div class="k-panel">
        <h2>inpaint</h2>
        <div id="gen"></div>
        <label class="k-field"><span>masked content</span><select id="fillModeSelect"></select></label>
      </div>
      <div class="k-panel">
        <h2>ControlNet</h2>
        <label class="k-field"><span>guide</span><select id="controlnetMode"></select></label>
        <label class="k-field"><span>weight</span><input type="range" id="controlWeight" min="0" max="1.5" step="0.05" value="0.8"><span class="k-val" id="controlWeightVal">0.80</span></label>
        <p class="k-note warn" id="control-note" hidden></p>
      </div>
    </aside>
  </div>
  <footer class="k-statusbar">
    <span id="status">starting…</span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
