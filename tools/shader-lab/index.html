<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shader Lab — WebGL2 GLSL 3.0 ES</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <style>
        .k-side { width: 50%; min-width: 0; padding: 0; gap: 0; }   /* editor | viewport, 1:1 */
        .pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--k-border); }
        .pane-head h2 { margin: 0; flex: 1; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--k-dim); }
        #shaderCode {
            flex: 1; min-height: 0; margin: 0; border: none; border-radius: 0; resize: none;
            background: #0a0c10; font-size: 13px; line-height: 1.5; white-space: pre; tab-size: 4;
        }
        #logOutput { margin: 0; padding: 8px 10px; height: 110px; overflow: auto; background: #080a0d; white-space: pre-wrap; }
        #uniforms { border-radius: 0; border-width: 1px 0 0 0; }
        #uniforms .k-field > span:first-child { width: 240px; }
        #glCanvas { cursor: crosshair; }
    </style>
</head>
<body class="k-app">
    <header class="k-header">
        <h1>WebGL2 Shader Lab</h1>
        <label class="k-field">Preset
            <select id="presetSelect">
                <option value="raymarch">SDF Raymarching Shapes</option>
                <option value="fractal">Mandelbrot Fractal Orbit</option>
                <option value="voronoi">Voronoi Cellular Noise</option>
                <option value="plasma">Interference Plasma Waves</option>
                <option value="fire">Volumetric Flame & Smoke</option>
            </select>
        </label>
        <button id="compileBtn" class="primary">▶ Compile (Ctrl+S)</button>
        <div class="k-spacer"></div>
        <span class="k-stats">
            <span id="badgeGl" class="ok">WebGL 2.0 (GLSL 3.0)</span>
            <span><b id="badgeFps">60 FPS</b></span>
            <span><b id="badgeRes">1280 × 800</b></span>
        </span>
    </header>

    <div class="k-body">
        <aside class="k-side">
            <div class="pane-head">
                <h2>Fragment Shader (GLSL 300 es)</h2>
                <button id="formatBtn" class="small">Reset to Preset</button>
                <button id="copyBtn" class="small">Copy Code</button>
            </div>
            <textarea id="shaderCode" spellcheck="false" autocomplete="off"></textarea>
            <div class="pane-head">
                <h2>Compilation Log</h2>
                <span id="logStatus" class="ok">No errors</span>
            </div>
            <pre id="logOutput"></pre>
        </aside>

        <main class="k-main">
            <div class="k-toolbar">
                <button id="playBtn" class="active">⏸ Pause</button>
                <button id="resetTimeBtn">⏮ Reset Time</button>
                <select id="scaleSelect">
                    <option value="1">1.0x Scale</option>
                    <option value="0.5">0.5x Fast</option>
                    <option value="2">2.0x HiDPI</option>
                </select>
            </div>
            <div class="k-viewport"><canvas id="glCanvas"></canvas></div>
            <div class="k-panel" id="uniforms"><h2>Dynamic Uniform Controls</h2></div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
