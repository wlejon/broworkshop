<!DOCTYPE html>
<html>
<head>
    <title>CSG Sculptor</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
    <header class="k-header">
        <h1>CSG Sculptor</h1>
        <span class="k-sub">carve a workpiece with boolean cutters (Mesh.booleanDifference / Union / Intersection)</span>
        <span class="k-spacer"></span>
        <span class="k-sub"><b>right-drag</b> orbit · <b>middle-drag</b> pan · <b>wheel</b> zoom · <b>W/E/R</b> gizmo · <b>Enter</b> apply</span>
    </header>

    <div class="k-toolbar" id="toolbar">
        <button id="undo" title="Undo (Ctrl+Z)">&#x21B6; Undo</button>
        <button id="redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">&#x21B7; Redo</button>
        <span class="k-sep"></span>
        <span class="k-row" id="ops"></span>
        <button id="apply" class="primary" title="Apply the cutter to the workpiece (Enter)">Apply boolean</button>
        <span class="k-spacer"></span>
        <button id="export-obj">Export OBJ</button>
        <button id="export-stl">Export STL</button>
    </div>

    <div class="k-body">
        <aside class="k-side">
            <div class="k-panel">
                <h2>Cutter</h2>
                <div class="k-row shapes" id="shapes"></div>
            </div>
            <div class="k-panel">
                <h2>Gizmo</h2>
                <div class="k-row" id="gizmo-modes"></div>
                <label class="k-field"><input type="checkbox" id="snap"> snap to 0.25 m grid</label>
                <button id="reset-cutter" class="small">Reset cutter transform</button>
            </div>
            <div class="k-panel">
                <h2>Cutter size</h2>
                <div id="dims"></div>
            </div>
        </aside>

        <main class="k-main">
            <div class="k-viewport"><canvas id="stage"></canvas></div>
        </main>

        <aside class="k-side right">
            <div class="k-panel">
                <h2>Workpiece</h2>
                <label class="k-field"><span>blank</span>
                    <select id="preset">
                        <option value="box">Cube (2.8 m)</option>
                        <option value="sphere">Sphere (r 1.6 m)</option>
                        <option value="cylinder">Cylinder</option>
                        <option value="column">Column</option>
                        <option value="bracket">Bracket</option>
                        <option value="torus">Torus ring</option>
                    </select>
                </label>
                <label class="k-field"><span>material</span>
                    <select id="material">
                        <option value="studio">Studio grey</option>
                        <option value="clay">Terracotta clay</option>
                        <option value="metal">Machined steel</option>
                        <option value="gold">Polished gold</option>
                        <option value="jade">Jade</option>
                    </select>
                </label>
            </div>
            <div class="k-panel">
                <h2>Mesh</h2>
                <div id="mesh-stats"></div>
            </div>
            <div class="k-panel">
                <h2>History</h2>
                <div id="history" class="k-note"></div>
            </div>
        </aside>
    </div>

    <footer class="k-statusbar"><span id="status"></span></footer>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
