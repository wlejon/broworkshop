<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Qwen TTS Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span id="brand">◑ Qwen&nbsp;TTS&nbsp;Lab</span>
      <span class="tagline">drive the voice through its real seams — design, deliver, stream, inspect</span>
      <span class="grow"></span>
      <span id="backend" class="badge">loading…</span>
    </header>

    <!-- which checkpoint: the variant decides which control surface appears -->
    <section id="modelbar">
      <label class="cfg">model
        <input id="model-dir" type="text" value="D:/projects/brosoundml/weights/qwen-tts/0.6B-customvoice">
      </label>
      <button id="btn-browse-model" class="iconbtn" title="Choose a Qwen3-TTS checkpoint directory">📁</button>
      <span class="quick">
        <button id="btn-cv"   class="chip" title="CustomVoice — preset speakers">custom</button>
        <button id="btn-vd"   class="chip" title="VoiceDesign — describe the voice">design</button>
        <button id="btn-base" class="chip" title="Base — clone / x-vector designer">base</button>
      </span>
      <span class="grow"></span>
      <span id="model-meta" class="meta"></span>
      <button id="btn-reload" title="Reload this checkpoint">↺</button>
    </section>

    <!-- VOICE — the identity seam. One of three panels shows, per variant. -->
    <section id="voice">
      <!-- CustomVoice: a palette of preset speakers -->
      <div id="voice-speaker" class="vpanel" style="display:none">
        <span class="vlabel">speaker</span>
        <select id="speaker" title="Preset speaker (CustomVoice)"></select>
        <span id="dialect" class="tag"></span>
        <label class="cfg lang">lang
          <select id="language" title="Synthesis language"></select>
        </label>
      </div>

      <!-- VoiceDesign: describe the voice in words -->
      <div id="voice-instruct" class="vpanel" style="display:none">
        <span class="vlabel">describe</span>
        <input id="instruct" type="text" placeholder="a warm, low-pitched elderly storyteller…"
               title="Natural-language voice description (VoiceDesign) — compose with the tags below or type freely">
        <span class="presets" id="instruct-presets"></span>
        <label class="cfg lang">lang
          <select id="language2" title="Synthesis language"></select>
        </label>
        <!-- composable description tags — assemble the instruct string by group -->
        <div id="instruct-tags" class="tag-groups"></div>
      </div>

      <!-- Base: the x-vector designer — enroll real voices, blend, render -->
      <div id="voice-designer" class="vpanel col" style="display:none">
        <div class="drow">
          <span class="vlabel">designer</span>
          <input id="ref-wav" type="text" placeholder="path to a reference .wav to enroll"
                 title="A clip whose speaker identity becomes an x-vector anchor">
          <button id="btn-browse-wav" class="iconbtn" title="Choose a reference clip">📁</button>
          <button id="btn-enroll" title="Encode the clip to a speaker x-vector anchor">⤓ enroll</button>
          <button id="btn-clone" title="Render directly from this clip (one-shot clone)">clone once</button>
          <button id="btn-rand-xv" title="A random in-distribution voice">🎲 random</button>
          <label class="cfg lang">lang
            <select id="language3" title="Synthesis language"></select>
          </label>
        </div>
        <div id="anchors" class="anchors" title="Blend the enrolled anchors — weights mix their x-vectors"></div>
        <div id="designer-meta" class="meta"></div>
        <!-- Emotion: learned contrastive directions in x-vector space (Base only).
             Hidden unless emotion_basis.json sits beside the checkpoint. -->
        <div id="emotion" style="display:none">
          <div class="emo-row">
            <span class="vlabel">emotion</span>
            <div class="emo-axes" title="Nudge the designed x-vector along each emotion direction — press Render to hear it"></div>
            <button id="btn-emo-reset" class="iconbtn" title="Drop all emotion, back to the plain designed voice">○ none</button>
          </div>
        </div>
        <!-- Masculine↔feminine: a bipolar acoustic vocal-quality axis (Base only).
             Hidden unless masc_fem_basis.json sits beside the checkpoint. -->
        <div id="mascfem" style="display:none">
          <div class="mf-row">
            <span class="vlabel">masc · fem</span>
            <span class="mf-pole mf-fem preset" title="set a default amount of feminine">← feminine</span>
            <input class="mf-range" type="range" min="-3" max="3" step="0.05" value="0"
                   title="Shift the designed voice toward feminine (left) or masculine (right) — press Render to hear it">
            <span class="mf-pole mf-masc preset" title="set a default amount of masculine">masculine →</span>
            <span class="mf-val">neutral</span>
            <button id="btn-mf-reset" class="iconbtn" title="Back to the neutral designed voice">○ none</button>
          </div>
        </div>
      </div>
    </section>

    <!-- DELIVERY — the sampling seam: how varied / how safe the take is -->
    <section id="delivery">
      <span class="vlabel">delivery</span>
      <div class="dial"><label>temp <span id="v-temp">0.00</span></label>
        <input id="temp" type="range" min="0" max="1.5" step="0.05" value="0"></div>
      <div class="dial"><label>top-k <span id="v-topk">0</span></label>
        <input id="topk" type="range" min="0" max="200" step="1" value="0"></div>
      <div class="dial"><label>top-p <span id="v-topp">1.00</span></label>
        <input id="topp" type="range" min="0" max="1" step="0.01" value="1"></div>
      <div class="dial" title="Repetition penalty on codebook 0 — &gt;1 discourages the Talker's droning/looping">
        <label>rep <span id="v-rep">1.05</span></label>
        <input id="rep" type="range" min="1" max="2" step="0.01" value="1.05"></div>
      <div class="dial" title="Confidence-adaptive temperature — sample hotter only where the model hedged (needs temp &gt; 0)">
        <label>adapt <span id="v-adapt">0.00</span></label>
        <input id="adapt" type="range" min="0" max="2" step="0.05" value="0"></div>
      <label class="cfg seed">seed
        <input id="seed" type="number" value="0" min="0" step="1">
      </label>
      <label class="lock" title="Keep the seed fixed across runs (A/B the same draw)">
        <input id="seed-lock" type="checkbox"> lock
      </label>
      <button id="btn-greedy" title="Back to greedy / deterministic (temp 0)">○ greedy</button>
      <span id="delivery-meta" class="meta"></span>
    </section>

    <!-- STEER — additive logit bias on codebook-0 (Talker) codes. Click row 0 of
         the code raster to stage the code under the cursor, or add an id by hand. -->
    <section id="steer">
      <span class="vlabel">steer</span>
      <div id="steer-list" class="steer-list"></div>
      <label class="cfg">code
        <input id="steer-id" type="number" min="0" step="1" placeholder="id">
      </label>
      <button id="btn-steer-add" title="Bias this codebook-0 code">+ bias</button>
      <button id="btn-steer-clear" title="Clear all biases">clear</button>
      <span id="steer-meta" class="meta"></span>
    </section>

    <!-- TEXT + transport. Render = inspect (off-thread + trace). Stream = realtime. -->
    <section id="prompt">
      <input id="text" type="text" value="Hello there. This is a test of the pipeline."
             placeholder="Type something to speak…">
      <button id="btn-render" disabled title="Synthesize off-thread, play, and draw the trace">▶ Render</button>
      <button id="btn-stream" disabled title="Stream audio as it generates (lowest latency)">⇶ Stream</button>
      <button id="btn-stop" disabled title="Barge-in: stop generation/playback now">■ Stop</button>
      <button id="btn-play" disabled title="Replay the last synthesized buffer">♪</button>
      <span id="run-meta" class="meta"></span>
      <span class="grow"></span>
      <span id="latency" class="meta"></span>
    </section>

    <main id="stages"></main>
  </div>

  <script src="lib/state.js"></script>
  <script src="lib/helpers.js"></script>
  <script src="lib/model.js"></script>
  <script src="lib/voice.js"></script>
  <script src="lib/emotion.js"></script>
  <script src="lib/mascfem.js"></script>
  <script src="lib/delivery.js"></script>
  <script src="lib/steer.js"></script>
  <script src="lib/audio.js"></script>
  <script src="lib/synth.js"></script>
  <script src="lib/render.js"></script>
  <script src="app.js"></script>
</body>
</html>
