<!DOCTYPE html>
<html>
<head>
    <title>Planet</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <style>
        body { background: #000; overflow: hidden; }
        canvas#stage { display: block; width: 100vw; height: 100vh; }
        .k-hud { width: 300px; }
        .help { color: #888; font-size: 11px; line-height: 1.5; }
        #stats { font-family: monospace; font-size: 11px; color: #9cf; white-space: pre; }
        /* core/loading.js: the boot panel over the stage, the corner chip after. */
        #loading {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 360px; padding: 20px 24px; border-radius: 10px;
            background: rgba(12, 14, 18, 0.88); border: 1px solid var(--k-border);
            display: flex; flex-direction: column; gap: 8px;
            opacity: 1; transition: opacity 0.5s ease;
        }
        #loading.done { opacity: 0; }
        #loading .title { font-size: 18px; color: var(--k-text); letter-spacing: 0.04em; }
        #loading .step { font-size: 13px; color: var(--k-value); }
        #loading .k-progress { flex: none; height: 6px; }
        #loading .k-progress > div { transition: width 0.25s ease; background: #6fa8dc; }
        #loading .detail { font-size: 11px; color: var(--k-dim); min-height: 14px; }
        #busy {
            position: fixed; right: 16px; bottom: 16px; padding: 6px 12px 6px 10px;
            border-radius: 14px; background: rgba(12, 14, 18, 0.8); border: 1px solid var(--k-border);
            display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--k-muted);
        }
        #busy[hidden] { display: none; }
        #busy .spin {
            width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid var(--k-border-hi); border-top-color: #6fa8dc;
            animation: busy-spin 0.8s linear infinite;
        }
        @keyframes busy-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div class="k-hud">
        <h2>Planet</h2>
        <label class="k-field"><span>Altitude</span><input id="alt" type="range" min="0" max="1000" step="1" value="980"><span class="k-val" id="altVal"></span></label>
        <label class="k-field"><span>Pitch</span><input id="pitch" type="range" min="-90" max="0" step="1" value="-90"><span class="k-val" id="pitchVal"></span></label>
        <label class="k-field"><span>Detail</span><input id="detail" type="range" min="1" max="8" step="0.5" value="2"><span class="k-val" id="detailVal"></span></label>
        <label class="k-field"><span>Sun</span><input id="sun" type="range" min="0" max="24" step="0.1" value="12"><span class="k-val" id="sunVal"></span></label>
        <div id="stats"></div>
        <div class="help">Drag: move over the ground · wheel: altitude · right-drag: look</div>
    </div>
    <script type="module" src="/app/app.js"></script>
</body>
</html>
