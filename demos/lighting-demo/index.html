<!DOCTYPE html>
<html>
<head>
    <title>Lighting Demo</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <style>
        body { background: #000; overflow: hidden; }
        canvas#stage { display: block; width: 100vw; height: 100vh; }
        .k-hud { width: 330px; }
        #selInfo { color: #fd9; min-height: 16px; }
        .help { color: #888; font-size: 11px; line-height: 1.5; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div class="k-hud">
        <h2>PBR Lighting Demo</h2>
        <label class="k-field"><span>Tonemap</span>
            <select id="mode">
                <option value="aces" selected>ACES</option>
                <option value="reinhard">Reinhard</option>
                <option value="linear">Linear</option>
            </select>
        </label>
        <label class="k-field"><span>Exposure</span><input id="exposure" type="range" min="0.2" max="3.0" step="0.05" value="1.0"><span class="k-val" id="exposureVal"></span></label>
        <label class="k-field"><span>Sun intensity</span><input id="sun" type="range" min="0" max="8" step="0.1" value="3.0"><span class="k-val" id="sunVal"></span></label>
        <label class="k-field"><span>Ambient</span><input id="ambient" type="range" min="0" max="0.2" step="0.005" value="0.03"><span class="k-val" id="ambientVal"></span></label>
        <label class="k-field"><span>Environment</span>
            <select id="hdri">
                <option value="">— none (flat ambient) —</option>
                <option value="venice_sunset">Venice sunset</option>
                <option value="kiara_1_dawn">Kiara dawn (savanna)</option>
                <option value="spruit_sunrise">Spruit sunrise</option>
                <option value="kloppenheim_06_puresky">Kloppenheim sky</option>
                <option value="kloofendal_43d_clear_puresky">Kloofendal clear sky</option>
                <option value="qwantani_puresky">Qwantani lake sky</option>
                <option value="belfast_sunset_puresky">Belfast sunset sky</option>
                <option value="the_sky_is_on_fire">Sky on fire</option>
                <option value="moonless_golf">Moonless golf</option>
                <option value="dikhololo_night">Dikhololo night (stars)</option>
                <option value="snowy_forest_path_01">Snowy forest path</option>
                <option value="spiaggia_di_mondello">Mondello beach</option>
            </select>
        </label>
        <span id="envStatus" class="dim"></span>
        <label class="k-field"><span>IBL intensity</span><input id="iblIntensity" type="range" min="0" max="3" step="0.05" value="1.0"><span class="k-val" id="iblIntensityVal"></span></label>
        <label class="k-field"><span>IBL rotation</span><input id="iblRotation" type="range" min="0" max="6.283" step="0.05" value="0"><span class="k-val" id="iblRotationVal"></span></label>
        <label class="k-field"><input type="checkbox" id="showIcons" checked> Show light icons</label>
        <label class="k-field"><input type="checkbox" id="animate" checked> Animate lights</label>
        <label class="k-field"><input type="checkbox" id="shadows"> Sun shadow</label>
        <div id="selInfo">Click a light icon to select.</div>
        <div class="help">
            Front row: dielectric, roughness sweep.<br>
            Back row: metal, roughness sweep.<br>
            Left-click light icons to select + gizmo.<br>
            <b>Right-drag</b>: orbit · <b>Middle-drag</b>: pan · <b>Wheel</b>: zoom
        </div>
    </div>
    <script type="module" src="/app/app.js"></script>
</body>
</html>
