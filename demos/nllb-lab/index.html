<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NLLB-200 Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>NLLB-200 Lab</h1>
    <span class="k-sub">bro.lm.loadNllb: many-to-many machine translation across 200+ FLORES languages</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <!-- a HF NLLB-200 checkpoint: config.json + model.safetensors + sentencepiece.bpe.model -->
  <div class="k-toolbar" id="model-bar"></div>
  <div class="k-toolbar">
    <label class="k-field"><span>from</span><select id="src-lang"></select></label>
    <button id="btn-swap" title="Swap languages (carries the translation back into the source)">⇄</button>
    <label class="k-field"><span>to</span><select id="tgt-lang"></select></label>
    <label class="k-field" title="Beam-search width: wider is slower, usually a little better"><span>beams</span>
      <input type="number" id="beams" value="5" min="1" max="10"></label>
    <span class="k-sep"></span>
    <button id="btn-translate" class="primary" disabled title="Translate (Ctrl+Enter)">Translate</button>
    <button id="btn-cancel" disabled title="Cancel the running translation">Cancel</button>
    <span class="dim" id="run-meta"></span>
  </div>
  <main class="k-main pad panes">
    <div class="pane">
      <div class="k-caption">source <span class="dim" id="src-name"></span></div>
      <textarea id="input" placeholder="Type text to translate…">The quick brown fox jumps over the lazy dog.</textarea>
    </div>
    <div class="pane">
      <div class="k-caption">translation <span class="dim" id="tgt-name"></span></div>
      <div id="output" class="k-box empty">The translation appears here.</div>
    </div>
  </main>
  <footer class="k-statusbar"><span id="status">loading…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
