<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NLLB-200 Lab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0c0e12; color: #d7dde6;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid #1d2330;
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: #6b7686; font-size: 12px; }
  .row { padding: 10px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 12px; color: #97a1b2; }
  input[type="text"], input[type="number"], select {
    background: #131720; color: #d7dde6; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 12px;
  }
  #model-dir { width: 420px; }
  #beams { width: 64px; }
  select { min-width: 200px; }
  button {
    background: #1b2638; color: #cfe0ff; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #233248; }
  button:disabled { opacity: .45; cursor: default; }
  #btn-swap { padding: 7px 10px; }
  .panes { flex: 1; display: flex; gap: 12px; padding: 4px 18px 12px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .pane .cap { font-size: 11px; color: #6b7686; margin-bottom: 4px; }
  textarea, #output {
    flex: 1; padding: 14px; overflow-y: auto; resize: none;
    background: #10141c; border: 1px solid #1d2330; border-radius: 8px;
    color: #d7dde6; font: inherit; font-size: 15px; line-height: 1.6;
    white-space: pre-wrap;
  }
  #output.partial { color: #97a1b2; }
  .statusbar {
    padding: 8px 18px; border-top: 1px solid #1d2330; font-size: 12px;
    color: #8a94a6; display: flex; gap: 24px;
  }
  .statusbar .err { color: #ff8585; }
</style>
</head>
<body>
  <header>
    <h1>NLLB-200 Lab</h1>
    <span class="sub">bro.lm.loadNllb — many-to-many machine translation across 200+ FLORES languages</span>
  </header>
  <div class="row">
    <label>model</label>
    <input type="text" id="model-dir">
    <button id="btn-load">Load</button>
  </div>
  <div class="row">
    <label>from</label>
    <select id="src-lang"></select>
    <button id="btn-swap" title="swap languages">⇄</button>
    <label>to</label>
    <select id="tgt-lang"></select>
    <label>beams</label>
    <input type="number" id="beams" value="5" min="1" max="10">
    <button id="btn-translate" disabled>Translate</button>
    <button id="btn-cancel" disabled>Cancel</button>
  </div>
  <div class="panes">
    <div class="pane">
      <div class="cap">source</div>
      <textarea id="input" placeholder="Type text to translate…">The quick brown fox jumps over the lazy dog.</textarea>
    </div>
    <div class="pane">
      <div class="cap">translation</div>
      <div id="output"></div>
    </div>
  </div>
  <div class="statusbar"><span id="status">loading…</span></div>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
