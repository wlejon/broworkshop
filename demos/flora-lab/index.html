<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>flora-lab</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <style>
        #tod { display: flex; flex-wrap: wrap; gap: 3px; }
        #layers .k-field { gap: 6px; }
        #layers .k-field > span:first-child { width: auto; }
        .swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.2); flex: none; }
        .help { color: var(--k-dim); font-size: 11px; }
    </style>
</head>
<body class="k-app">
    <header class="k-header">
        <h1>flora-lab</h1>
        <span class="k-sub">bro.flora ecosystem sim on a worker: branch tubes, scattered leaves and blooms grown live, with the sim's internals as overlays</span>
    </header>
    <div class="k-body">
        <aside class="k-side">
            <div class="k-panel">
                <h2>Simulation</h2>
                <div class="k-row">
                    <button id="play"></button>
                    <button id="step">Step</button>
                    <button id="seed">+ Seedling</button>
                    <button id="reset">Reset</button>
                </div>
                <label class="k-field"><span>time scale</span>
                    <input id="timeScale" type="range" min="0.1" max="5" step="0.1" value="1"><span class="k-val" id="timeScaleV"></span></label>
                <label class="k-field"><span>temperature</span>
                    <input id="temp" type="range" min="-5" max="30" step="0.5" value="15"><span class="k-val" id="tempV"></span></label>
            </div>
            <div class="k-panel">
                <h2>Time of day</h2>
                <div id="tod"></div>
            </div>
            <div class="k-panel">
                <h2>Layers</h2>
                <div class="k-col" id="layers"></div>
            </div>
            <div class="help">Drag orbits · right-drag pans · wheel zooms.</div>
        </aside>
        <main class="k-main">
            <div class="k-viewport"><canvas id="stage"></canvas></div>
        </main>
    </div>
    <footer class="k-statusbar">
        <span id="status">starting…</span>
        <span class="k-stats" id="stats"></span>
    </footer>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
