<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Qwen3-ASR Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/lib/kit/speech.css">
<style>
  #context { width: 420px; }
  #lang { color: var(--k-ok); }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Qwen3-ASR Lab</h1>
    <span class="k-sub">bro.stt.loadQwenAsr: 52-language speech-to-text with language ID and context biasing</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <!-- a Qwen3-ASR checkpoint: config.json + safetensors + vocab.json / merges.txt -->
  <div class="k-toolbar" id="model-bar"></div>
  <div class="k-toolbar" id="input-bar"></div>
  <div class="k-toolbar">
    <label class="k-field" title="Names / domain terms placed in the chat template's system block to bias recognition toward them">
      <span>context bias</span>
      <input type="text" id="context" placeholder="names or domain terms (optional)">
    </label>
    <button id="btn-transcribe" class="primary" disabled>Transcribe</button>
    <button id="btn-cancel" disabled>Cancel</button>
    <span class="dim" id="run-meta"></span>
  </div>
  <main class="k-main pad">
    <div class="k-caption">language <b id="lang">—</b></div>
    <div class="k-caption">transcript <span class="dim">the decoder's text half, streamed as it is emitted</span></div>
    <div id="transcript"></div>
    <div class="k-caption">source</div>
    <canvas id="timeline" class="k-timeline"></canvas>
  </main>
  <footer class="k-statusbar"><span id="status">loading…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
