<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Qwen3-ASR Lab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0c0e12; color: #d7dde6;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid #1d2330;
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: #6b7686; font-size: 12px; }
  .row { padding: 10px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 12px; color: #97a1b2; }
  input[type="text"] {
    background: #131720; color: #d7dde6; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 12px;
  }
  #model-dir { width: 420px; }
  #src-file  { width: 340px; }
  #context   { width: 420px; }
  button {
    background: #1b2638; color: #cfe0ff; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #233248; }
  button:disabled { opacity: .45; cursor: default; }
  button.recording { background: #6f2f2f; border-color: #8c3c3c; color: #ffeaea; }
  .miclevel { width: 120px; height: 8px; background: #131720; border: 1px solid #1d2330;
              border-radius: 4px; overflow: hidden; }
  .miclevel div { height: 100%; width: 0%; background: #3c8c63; }
  .langline { padding: 4px 18px; font-size: 12px; color: #8a94a6; }
  .langline b { color: #8be0ae; }
  #transcript {
    flex: 1; margin: 8px 18px 12px; padding: 14px; overflow-y: auto;
    background: #10141c; border: 1px solid #1d2330; border-radius: 8px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap;
  }
  #transcript .partial { color: #97a1b2; }
  .statusbar {
    padding: 8px 18px; border-top: 1px solid #1d2330; font-size: 12px;
    color: #8a94a6; display: flex; gap: 24px;
  }
  .statusbar .err { color: #ff8585; }
</style>
</head>
<body>
  <header>
    <h1>Qwen3-ASR Lab</h1>
    <span class="sub">bro.stt.loadQwenAsr — 52-language speech-to-text with language ID + context biasing</span>
  </header>
  <div class="row">
    <label>model</label>
    <input type="text" id="model-dir">
    <button id="btn-load">Load</button>
  </div>
  <div class="row">
    <button id="btn-record" disabled>● record</button>
    <div class="miclevel"><div id="miclevel-fill"></div></div>
    <input type="text" id="src-file" placeholder="…or an audio file path (wav/flac/mp3/ogg)">
    <button id="btn-loadfile">Open</button>
    <button id="btn-play" disabled>▶ play</button>
  </div>
  <div class="row">
    <label>context bias</label>
    <input type="text" id="context" placeholder="names / domain terms to bias recognition toward (optional)">
    <button id="btn-transcribe" disabled>Transcribe</button>
    <button id="btn-cancel" disabled>Cancel</button>
  </div>
  <div class="langline">language: <b id="lang">—</b></div>
  <div id="transcript"></div>
  <div class="statusbar"><span id="status">loading…</span></div>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
