<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LM Playground</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  #family { width: 200px; }
  #model-path { width: 480px; }
  #prompt { margin: 0 var(--k-pad); height: 70px; font-size: 13px; }
  #reply { flex: 1; margin: 10px var(--k-pad) 12px; font-size: 14px; }
  #reply.streaming { color: #b9c4d4; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>LM Playground</h1>
    <span class="k-sub">bro.lm — Qwen3, Qwen3.5, Mistral 3.1 behind one streaming generate</span>
  </header>
  <div class="k-toolbar bare">
    <select id="family">
      <option value="qwen35">Qwen3.5 (safetensors dir)</option>
      <option value="qwen3">Qwen3 (GGUF)</option>
      <option value="mistral3">Mistral 3.1 (GGUF + tekken)</option>
    </select>
    <input type="text" id="model-path">
    <button id="btn-load">Load</button>
  </div>
  <div class="k-toolbar bare">
    <label class="k-field">max tokens <input type="number" id="max-tokens" min="8" max="2048" step="8" value="256"></label>
    <label class="k-field">temperature <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7"></label>
    <button id="btn-generate" disabled>Generate</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>
  <textarea id="prompt" placeholder="ask anything…">Give me one fun fact about octopuses, in one sentence.</textarea>
  <div id="reply" class="k-box"></div>
  <footer class="k-statusbar">
    <span id="status">pick a model family and Load</span>
    <span id="rate"></span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
