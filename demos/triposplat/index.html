<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TripoSplat Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>TripoSplat Lab</h1>
    <span class="k-sub">bro.triposplat: one image to a 3D Gaussian splat (DINOv3 + Flux.2 VAE, flow-matching DiT, octree decoder), on device</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <div class="k-body">
    <aside class="k-side">
      <div class="k-panel">
        <h2>Image</h2>
        <div class="k-gallery" id="samples"></div>
        <div class="k-row">
          <button id="btn-open" title="Open an image (or drop one on the viewport)">Open image…</button>
          <span class="dim" id="image-meta"></span>
        </div>
        <canvas id="thumb" hidden></canvas>
        <label class="k-field" id="bg-row"><input id="bg-remove" type="checkbox" disabled> remove background (BiRefNet)</label>
      </div>
      <div class="k-panel">
        <h2>Reconstruction</h2>
        <div id="params" class="k-col"></div>
        <div class="k-row">
          <label class="k-field"><span>seed</span><input id="seed" type="number" min="0" value="42"></label>
          <button id="btn-rand" class="small" title="Random seed">random</button>
        </div>
        <div class="k-row">
          <button id="btn-go" class="primary" disabled>Generate</button>
          <span class="dim" id="elapsed"></span>
        </div>
      </div>
      <div class="k-panel">
        <h2>Weights</h2>
        <div class="k-kv" id="weights"></div>
      </div>
    </aside>
    <main class="k-main">
      <div class="k-toolbar">
        <label class="k-field"><input id="autorotate" type="checkbox" checked> auto-rotate</label>
        <button id="btn-reset" class="small">reset view</button>
        <label class="k-field"><span>scale</span><input id="vscale" type="range" min="20" max="300" value="100"><span class="k-val" id="vscale-val">1.00</span></label>
        <label class="k-field"><input id="vlight" type="checkbox"> light background</label>
        <span class="k-spacer"></span>
        <span class="dim" id="splat-meta"></span>
        <button id="btn-save" disabled title="Export the splat as a .ply">Save .ply…</button>
      </div>
      <div class="k-viewport" id="stage">
        <canvas id="view"></canvas>
        <div class="k-hint" id="view-hint">Loading models…</div>
        <div class="k-hud right dim">left-drag orbit · middle-drag pan · wheel zoom</div>
      </div>
    </main>
  </div>
  <footer class="k-statusbar"><span id="status">loading…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
