<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e6e6;
               font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100%; }
  #side { width: 300px; padding: 18px; box-sizing: border-box; background: #16191e;
          border-right: 1px solid #262b33; display: flex; flex-direction: column; gap: 14px; }
  #side h1 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
  #side .sub { font-size: 12px; color: #8a93a0; margin-top: -8px; line-height: 1.4; }
  #thumb { width: 100%; aspect-ratio: 1; background: #0d0f12 center/contain no-repeat;
           border: 1px solid #262b33; border-radius: 8px; }
  label { font-size: 12px; color: #9aa3b0; display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 7px; padding: 10px;
           font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #2a3340; color: #6b7280; cursor: default; }
  #status { font-size: 12px; color: #8a93a0; min-height: 16px; }
  #stage { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #5b636e; }
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div>
      <h1>TripoSplat</h1>
      <div class="sub">Single image &rarr; 3D Gaussian Splat. DINOv3 + Flux.2 VAE &rarr;
        flow DiT &rarr; octree decoder, all on-device.</div>
    </div>
    <div id="thumb"></div>
    <label>Steps <span id="vSteps">12</span></label>
    <input id="steps" type="range" min="4" max="30" value="12">
    <label>Guidance <span id="vCfg">3.0</span></label>
    <input id="cfg" type="range" min="10" max="70" value="30">
    <label>Gaussians <span id="vNg">131072</span></label>
    <input id="ng" type="range" min="32768" max="262144" step="32768" value="131072">
    <button id="go">Generate</button>
    <div id="status">Loading models&hellip;</div>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hint">drag to orbit &middot; scroll to zoom</div>
  </div>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
