<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mic Chunks</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Mic Chunks</h1>
    <span class="k-sub">bro.mic — fixed-size frames (chunkFrames) from broaudio's mic tap</span>
  </header>
  <div class="k-toolbar">
    <button id="toggle">Start</button>
    <label class="k-field"><input type="checkbox" id="agc"> AGC</label>
    <span class="k-sub" id="cfg"></span>
  </div>
  <main class="k-main">
    <div class="k-viewport"><canvas id="scope"></canvas></div>
  </main>
  <footer class="k-statusbar">
    <span id="status"></span>
    <span class="k-stats">
      <span>chunks <b id="chunkCount">0</b></span>
      <span>frames/chunk <b id="chunkFrames">—</b></span>
      <span>rolling peak <b id="rollingPeak">0.000</b></span>
      <span>dropped <b id="dropped">0</b></span>
    </span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
