<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RAVE Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>RAVE Lab</h1>
    <span class="k-sub">bro.rave: encode a sound to its latent curves, reshape them, hear it morph</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <!-- a converted RAVE v2 dir: config.json + model.safetensors -->
  <div class="k-toolbar" id="model-bar">
    <label class="k-field" title="Converted RAVE models found under brosoundml-data/rave"><span>preset</span>
      <select id="preset"></select></label>
  </div>
  <div class="k-toolbar">
    <span class="dim">source</span>
    <label class="k-field"><span>tone</span><input id="tone-freq" type="number" value="220" min="20" max="8000" step="1"> Hz</label>
    <label class="k-field"><span>secs</span><input id="tone-secs" type="number" value="1.5" min="0.2" max="8" step="0.1"></label>
    <select id="tone-kind" title="Tone shape to encode">
      <option value="harm">harmonic</option>
      <option value="sine">sine</option>
      <option value="saw">saw</option>
      <option value="sweep">sweep</option>
      <option value="noise">noise burst</option>
    </select>
    <button id="btn-tone" disabled title="Generate this tone and encode it">Tone</button>
    <span class="k-sep"></span>
    <input id="src-file" type="text" placeholder="audio file (.wav / .flac / .mp3 / .ogg)">
    <button id="btn-browse-file" class="small" title="Choose an audio file">…</button>
    <button id="btn-loadfile" disabled title="Decode the file and encode it">load</button>
    <span class="dim" id="src-meta"></span>
  </div>
  <div class="k-toolbar">
    <button id="btn-play-src" disabled title="Play the source">▷ source</button>
    <button id="btn-play-out" disabled title="Play the morphed resynthesis">▶ morph</button>
    <button id="btn-save" disabled title="Save the morph as a .wav">Save .wav</button>
    <span class="k-sep"></span>
    <button id="btn-decode" disabled title="Re-decode the edited latent">Decode</button>
    <button id="btn-reset" disabled title="Restore every curve to the encoded latent">Reset all</button>
    <label class="k-field" title="Add RAVE's stochastic FFT noise-synth branch (breathy / unvoiced texture). Seeded, so the morph stays reproducible."><input id="noise" type="checkbox"> noise</label>
    <label class="k-field" title="Decode in stereo: the mono decoder runs once per channel, decorrelated by an independent latent pad (RAVE 'stereo mode')."><input id="stereo" type="checkbox"> stereo</label>
    <label class="k-field" title="Stereo width: std of the per-channel latent pad. RAVE-native = 1.0; larger is wider, 0 collapses to mono."><span>width</span>
      <input id="width" type="number" value="1.0" min="0" max="4" step="0.1"></label>
    <label class="k-field"><input id="autoplay" type="checkbox" checked> autoplay</label>
    <span class="dim" id="run-meta"></span>
  </div>
  <main class="k-main pad">
    <div class="wave-row"><span class="wave-label">source</span><div class="k-grow"><canvas id="wave-src"></canvas></div></div>
    <div class="wave-row"><span class="wave-label">morph</span><div class="k-grow"><canvas id="wave-out"></canvas></div></div>
    <div class="k-caption" id="curves-head" hidden>latent <span class="dim">PCA-sorted axes · dim 0 ≈ loudness · dim 1 ≈ pitch · 2+ ≈ timbre · drag a curve to reshape it</span></div>
    <div id="curves" class="k-col"></div>
    <p id="hint" class="k-note">Load a RAVE model, then make a tone or open a file to begin.</p>
  </main>
  <footer class="k-statusbar"><span id="status">loading…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
