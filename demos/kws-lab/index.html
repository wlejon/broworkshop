<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KWS Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  #phrase { width: 260px; }
  #threshold { width: 70px; }
  .templates { min-height: 38px; }
  .k-chip { padding: 4px 6px 4px 12px; transition: background .12s, border-color .12s; }
  .k-chip.fired { background: var(--k-on); border-color: #54d68a; }
  .k-chip button { padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .pct { color: #8a94a6; width: 110px; }
  .k-log .name { color: #8be0ae; font-weight: 600; }
  .k-log .conf { color: var(--k-muted); margin-left: 10px; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>KWS Lab</h1>
    <span class="k-sub">bro.kws — open-vocabulary keyword spotting: enroll any phrase, spot it live</span>
  </header>
  <div class="k-toolbar bare">
    <input type="text" id="phrase" placeholder="phrase to enroll (e.g. open the pod bay doors)">
    <button id="enroll">Enroll</button>
    <label class="k-field">threshold <input type="number" id="threshold" min="0.1" max="0.9" step="0.05" value="0.40"></label>
    <button id="listen" disabled>Listen</button>
  </div>
  <div class="k-toolbar templates" id="templates"><span class="k-sub" id="noTemplates">no templates enrolled</span></div>
  <div class="k-toolbar bare">
    <div class="k-progress" id="progress"></div>
    <span class="pct" id="progressPct">prefix 0%</span>
  </div>
  <div class="k-log" id="log"></div>
  <footer class="k-statusbar">
    <span id="status">loading…</span>
    <span>spots: <b id="spotCount">0</b></span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
