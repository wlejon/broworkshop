<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KWS Lab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0c0e12; color: #d7dde6;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid #1d2330;
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: #6b7686; font-size: 12px; }
  .controls { padding: 10px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: #97a1b2; display: flex; gap: 6px; align-items: center; }
  input[type="text"] {
    background: #131720; color: #d7dde6; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 12px; width: 260px;
  }
  input[type="number"] {
    background: #131720; color: #d7dde6; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; width: 70px;
  }
  button {
    background: #1b2638; color: #cfe0ff; border: 1px solid #2c3c57;
    border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #233248; }
  button.active { background: #2f6f4f; border-color: #3c8c63; color: #eafff2; }
  button:disabled { opacity: .45; cursor: default; }
  .templates {
    padding: 6px 18px; display: flex; gap: 8px; flex-wrap: wrap; min-height: 38px;
    border-bottom: 1px solid #1d2330; align-items: center;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: #16203a; border: 1px solid #2c3c57; border-radius: 14px;
    padding: 4px 6px 4px 12px; font-size: 12px; transition: background .12s, border-color .12s;
  }
  .chip.fired { background: #2f6f4f; border-color: #54d68a; }
  .chip .len { color: #6b7686; }
  .chip button { padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .progress { padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
  .progress .bar {
    flex: 1; height: 10px; background: #131720; border: 1px solid #1d2330;
    border-radius: 5px; overflow: hidden;
  }
  .progress .fill { height: 100%; width: 0%; background: #3c8c63; transition: width .08s linear; }
  .progress .pct { font-size: 12px; color: #8a94a6; width: 110px; }
  .log { flex: 1; overflow-y: auto; padding: 6px 18px; font-size: 12px; }
  .log .row { padding: 3px 0; border-bottom: 1px solid #131720; }
  .log .row .t { color: #6b7686; margin-right: 10px; }
  .log .row .name { color: #8be0ae; font-weight: 600; }
  .log .row .conf { color: #97a1b2; margin-left: 10px; }
  .statusbar {
    padding: 8px 18px; border-top: 1px solid #1d2330; font-size: 12px;
    color: #8a94a6; display: flex; gap: 24px;
  }
  .statusbar b { color: #d7dde6; font-weight: 600; }
  .statusbar .err { color: #ff8585; }
</style>
</head>
<body>
  <header>
    <h1>KWS Lab</h1>
    <span class="sub">bro.kws — open-vocabulary keyword spotting: enroll any phrase, spot it live</span>
  </header>
  <div class="controls">
    <input type="text" id="phrase" placeholder="phrase to enroll (e.g. open the pod bay doors)">
    <button id="enroll">Enroll</button>
    <label>threshold <input type="number" id="threshold" min="0.1" max="0.9" step="0.05" value="0.40"></label>
    <button id="listen" disabled>Listen</button>
  </div>
  <div class="templates" id="templates"><span class="sub" id="noTemplates">no templates enrolled</span></div>
  <div class="progress">
    <div class="bar"><div class="fill" id="progressFill"></div></div>
    <span class="pct" id="progressPct">prefix 0%</span>
  </div>
  <div class="log" id="log"></div>
  <div class="statusbar">
    <span id="status">loading…</span>
    <span>spots: <b id="spotCount">0</b></span>
  </div>
  <script src="main.js"></script>
</body>
</html>
