<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Plant Recipes</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <style>
        #mode > button { flex: 1; }
        #stage-bar { display: flex; flex-wrap: wrap; gap: 3px; }
        #stage-bar > button { flex: 1 1 60px; padding: 2px 4px; }
        #tod { display: flex; flex-wrap: wrap; gap: 3px; }
        .k-side .k-row { gap: 6px; }
        .help { color: var(--k-dim); font-size: 11px; }
    </style>
</head>
<body class="k-app">
    <header class="k-header">
        <h1>Plant Recipes</h1>
        <span class="k-sub">eleven procedural plant archetypes built from bro.mesh primitives, through eight life-cycle stages, alone or as a packed forest</span>
    </header>
    <div class="k-body">
        <aside class="k-side">
            <div class="k-row" id="mode"></div>
            <div class="k-panel">
                <h2>Life cycle</h2>
                <div id="stage-bar"></div>
            </div>
            <div class="k-col" id="params"></div>
            <div class="k-panel">
                <h2>Light</h2>
                <div id="tod"></div>
            </div>
            <div class="k-row">
                <button id="regen" class="primary">Regenerate</button>
                <button id="fit">Fit</button>
                <button id="reseed">New seed</button>
                <button id="reset">Reset</button>
                <button id="anim">Cycle</button>
            </div>
            <div class="help">Drag orbits · right-drag pans · wheel zooms. Cycle sweeps the age through every stage.</div>
        </aside>
        <main class="k-main">
            <div class="k-viewport"><canvas id="stage"></canvas></div>
        </main>
    </div>
    <footer class="k-statusbar">
        <span id="status">starting…</span>
    </footer>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
