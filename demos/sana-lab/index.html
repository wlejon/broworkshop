<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sana Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Sana Lab</h1>
    <span class="k-sub">hold one face while you steer Sana through its own conditioning space</span>
    <span class="k-spacer"></span>
    <span id="backend">loading…</span>
  </header>
  <div class="k-body">
    <aside class="k-side">
      <div class="k-panel">
        <h2>model</h2>
        <div id="model"></div>
      </div>
      <div class="k-panel">
        <h2>generate</h2>
        <div id="gen"></div>
      </div>
      <div class="k-panel" id="identity">
        <h2>identity <span class="dim">hold one face across edits</span></h2>
        <label class="k-stack"><span class="k-cap">anchor · the face to keep</span>
          <textarea id="anchor-prompt" rows="3" placeholder="a portrait photo of a person, neutral expression, plain studio background">a portrait photo of a woman, neutral expression, head and shoulders, plain studio background</textarea></label>
        <button id="capture">Capture anchor</button>
        <label class="k-field" id="strength-row"><span>strength</span>
          <input id="identity-weight" type="range" min="0" max="2.5" step="0.1" value="1">
          <span class="k-val" id="identity-weight-val">1.0</span>
          <button id="clear-anchor" class="k-link" title="Drop the anchor" disabled>clear</button></label>
        <p class="k-note" id="identity-hint"></p>
      </div>
      <div class="k-panel">
        <h2>axes <span class="dim">two word sets → a direction</span>
          <button id="zero-axes" class="k-link" title="Zero every strength slider">reset</button></h2>
        <div id="axes"></div>
      </div>
    </aside>
    <main class="k-main">
      <div class="panes">
        <section class="pane" id="ref-pane" hidden>
          <div class="pane-head">identity reference <span class="dim">the face being held</span></div>
          <div class="k-viewport"><canvas id="ref-view"></canvas></div>
        </section>
        <section class="pane">
          <div class="pane-head">generation <span class="dim" id="gen-sub"></span></div>
          <div class="k-viewport">
            <canvas id="view"></canvas>
            <div class="k-hint" id="view-hint">Load a model, then Generate.</div>
          </div>
        </section>
      </div>
      <div class="k-toolbar" id="run"></div>
      <div class="k-toolbar bare" id="gallery"></div>
    </main>
  </div>
  <footer class="k-statusbar">
    <span id="status">idle</span>
    <span class="dim" id="timing"></span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
