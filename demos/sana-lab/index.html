<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sana Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span id="brand">⬡ Sana&nbsp;Lab</span>
      <span class="tagline">steer Sana through its own conditioning space</span>
      <span class="grow"></span>
      <span id="backend" class="badge">loading…</span>
    </header>

    <div id="body">
      <!-- ── left rail: model, prompt, generation settings, controls ──── -->
      <aside id="rail">
        <section class="panel">
          <h2>model</h2>
          <label class="field">Sana directory
            <span class="row">
              <input id="model-dir" type="text"
                     value="D:/projects/brodiffusion/weights/sana-1.6b">
              <button id="btn-browse-model" class="iconbtn"
                      title="Choose a Sana diffusers directory">📁</button>
            </span>
          </label>
          <button id="btn-load" class="primary">Load model</button>
        </section>

        <section class="panel">
          <h2>prompt</h2>
          <label class="field">
            <span class="field-head">prompt <span class="counter" id="prompt-count"></span></span>
            <textarea id="prompt" rows="3" maxlength="1000"
              placeholder="a photo of a small bird perched on a branch">a photo of a small bird perched on a branch</textarea>
          </label>
          <label class="field">
            <span class="field-head">negative prompt
              <span class="hint inline">— what to avoid</span>
              <span class="counter" id="neg-count"></span></span>
            <textarea id="neg-prompt" rows="2" maxlength="1000"
              placeholder="deformed eyes, asymmetric eyes, blurry, low quality, extra fingers"></textarea>
          </label>

          <div class="subhead">settings
            <button id="btn-reset-settings" class="link"
                    title="Restore seed / steps / guidance / size to defaults">reset</button>
          </div>
          <div class="grid">
            <label class="field">seed <span class="dim">· def 0</span>
              <input id="seed" type="number" value="0" step="1"></label>
            <label class="field">steps <span class="dim">· def 20</span>
              <input id="steps" type="number" value="20" min="1" max="50"></label>
            <label class="field">guidance <span class="dim">· def 4.5</span>
              <input id="guidance" type="number" value="4.5" step="0.5"></label>
            <label class="field">size <span class="dim">· def 1024²</span>
              <select id="size">
                <option value="1024" selected>1024²</option>
                <option value="768">768²</option>
                <option value="512">512²</option>
              </select></label>
          </div>
          <div class="row gen-row">
            <button id="btn-generate" class="primary" disabled>Generate</button>
            <label class="live-toggle" title="Re-render as you drag the sliders (fast preview)">
              <input id="live" type="checkbox"> live
            </label>
          </div>
        </section>

        <!-- ── identity anchor: Sana's training-free reference-attention seam ── -->
        <section class="panel" id="identity-host">
          <h2>identity
            <span class="hint inline">hold one face across edits</span>
          </h2>
          <label class="field">anchor &mdash; the face to keep
            <textarea id="anchor-prompt" rows="2"
              placeholder="a portrait photo of a person, neutral expression, plain studio background">a portrait photo of a woman, neutral expression, head and shoulders, plain studio background</textarea></label>
          <div class="row anchor-row">
            <button id="btn-capture-anchor">Capture anchor</button>
            <canvas id="anchor-thumb" width="64" height="64" title="captured identity"></canvas>
          </div>
          <label class="field">strength
            <span class="row">
              <input id="identity-weight" type="range" min="0" max="2.5" step="0.1" value="1">
              <button id="btn-clear-anchor" class="link" title="Drop the anchor">clear</button>
            </span>
          </label>
          <p id="identity-hint" class="hint"></p>
        </section>

        <section class="panel grow-panel">
          <h2>axes
            <span class="hint inline">two word sets &rarr; a direction</span>
            <span class="grow"></span>
            <button id="btn-reset-ctl" class="link" title="Zero every strength slider">reset</button>
          </h2>

          <label class="field">name <span class="hint inline">(optional)</span>
            <input id="axis-name" type="text" placeholder="petal size"></label>
          <label class="field">set A &mdash; the “from” concept
            <textarea id="search-neg" rows="2"
              placeholder="large petals"></textarea></label>
          <label class="field">set B &mdash; the “to” concept
            <textarea id="search-pos" rows="2"
              placeholder="small petals"></textarea></label>
          <button id="btn-build-axis" disabled>Add axis</button>

          <p id="ctl-hint" class="hint">Load a model, then add an axis from two word sets.</p>
          <div id="axes-host"></div>
        </section>
      </aside>

      <!-- ── viewport ─────────────────────────────────────────────────── -->
      <main id="stage">
        <div id="canvas-wrap">
          <canvas id="view" width="512" height="512"></canvas>
          <div id="view-hint">Load a model, then Generate.</div>
        </div>
        <div id="status-bar">
          <span id="status-text">idle</span>
          <span class="grow"></span>
          <span id="timing" class="meta"></span>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
