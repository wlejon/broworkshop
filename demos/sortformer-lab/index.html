<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sortformer Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/lib/kit/speech.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Sortformer Lab</h1>
    <span class="k-sub">bro.diar.loadSortformer: who is speaking, live. Streaming 4-speaker diarization on any audio source</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <!-- a converted Sortformer checkpoint: config.json + model.safetensors
       (brosoundml/scripts/convert-sortformer.py) -->
  <div class="k-toolbar" id="model-bar"></div>
  <div class="k-toolbar" id="input-bar"></div>
  <div class="k-toolbar" id="live-bar">
    <label class="k-field" title="How much audio the model hears per update. Longer separates similar-sounding speakers better (it has to hear enough of each voice), at the cost of latency. The model's native chunk is ~15 s.">
      <span>context</span>
      <select id="ctx">
        <option value="1">1 s · lowest latency</option>
        <option value="2">2 s</option>
        <option value="4" selected>4 s · balanced</option>
        <option value="8">8 s</option>
        <option value="15">15 s · best separation</option>
      </select>
    </label>
    <label class="k-field"><span>threshold</span>
      <input id="thresh" type="range" min="0.05" max="0.9" step="0.05" value="0.5"><span class="k-val" id="thresh-val"></span></label>
    <button id="btn-diarize" disabled title="Diarize the source clip offline (whole clip at once)">Diarize clip</button>
    <button id="btn-clear" title="Clear the timeline and the speaker cache">Clear</button>
  </div>
  <main class="k-main pad">
    <div class="k-caption">speakers <span class="dim">arrival order · bar = activity this instant · time = total above threshold</span></div>
    <div id="speakers" class="k-speakers"></div>
    <div class="k-caption">timeline <span class="dim">one column per 80 ms frame · lanes are speakers · brighter = more confident</span></div>
    <canvas id="lanes" class="k-lanes"></canvas>
    <div id="stats" class="k-stats"></div>
  </main>
  <footer class="k-statusbar"><span id="status">loading…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
