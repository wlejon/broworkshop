<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foundry</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/foundry.css">
</head>
<body class="k-app f-app">

<header class="f-head">
  <div class="f-brand"><span class="f-mark"></span>Foundry</div>
  <nav id="crumbs" class="f-crumbs"></nav>
  <span class="k-spacer"></span>
  <div id="goalPill" class="f-pill"></div>
  <button id="undo" class="small" disabled title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" class="small" disabled title="Redo (Ctrl+Y)">Redo</button>
</header>

<div class="f-body">
  <aside class="f-left">
    <section class="f-card">
      <h2>Library</h2>
      <div id="library" class="f-lib"></div>
      <div class="f-lib-actions">
        <button id="newDesign" class="small" title="An empty design (Ctrl+N)">New</button>
        <button id="copyDesign" class="small" title="A copy of the open design to change">Copy</button>
        <button id="delDesign" class="small danger">Delete</button>
      </div>
    </section>
    <section class="f-card f-grow">
      <h2>Add to this design</h2>
      <div id="palette" class="f-palette"></div>
    </section>
  </aside>

  <main class="f-center">
    <canvas id="stage3d" class="f-stage"></canvas>
    <div class="f-title" id="title"></div>
    <div class="f-flow" id="flow"></div>
  </main>

  <aside class="f-right">
    <section class="f-card" id="goalCard">
      <h2>Goal</h2>
      <div id="goal"></div>
    </section>
    <section class="f-card">
      <h2>Contract <span class="f-hint">what the level above sees</span></h2>
      <div id="contract"></div>
    </section>
    <section class="f-card">
      <h2>Output <span class="f-hint" id="outHint"></span></h2>
      <canvas id="curve" class="f-curve"></canvas>
      <label class="f-slider">Load <input type="range" id="load" min="0" max="1" step="0.01" value="0.45"><span id="loadVal"></span></label>
    </section>
    <section class="f-card" id="problemsCard">
      <h2>Problems</h2>
      <div id="problems"></div>
    </section>
    <section class="f-card f-grow">
      <h2 id="inspTitle">Selected</h2>
      <div id="inspector"></div>
    </section>
  </aside>
</div>

<footer class="k-statusbar f-status"><span id="status"></span><span class="k-spacer"></span><span id="stats"></span></footer>

<script type="module" src="/app/main.js"></script>
</body>
</html>
