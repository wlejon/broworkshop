<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Arena</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
    <header class="k-header">
        <h1>AI Arena</h1>
        <span class="k-sub">bro.ai.game — agents, planners, MCTS, fog of war and replays in one arena</span>
    </header>

    <div class="k-toolbar">
        <label class="k-field"><span>Scenario</span><select id="sel-scenario"></select></label>
        <label class="k-field"><span class="red">Red AI</span><select id="sel-red-ai"></select></label>
        <label class="k-field"><span class="blue">Blue AI</span><select id="sel-blue-ai"></select></label>
        <div class="k-sep"></div>
        <button id="btn-pause">Pause</button>
        <button id="btn-rewind">Rewind 2s</button>
        <button id="btn-reset">Reset</button>
        <div class="k-sep"></div>
        <button id="btn-record">Record</button>
        <button id="btn-play">Play</button>
        <div class="k-sep"></div>
        <label class="k-field"><span>Focus</span><select id="sel-focus"></select></label>
        <button id="btn-fog">Fog off</button>
        <select id="sel-fog-team">
            <option value="0">Red view</option>
            <option value="1">Blue view</option>
        </select>
    </div>

    <div class="k-body">
        <main class="k-main">
            <div class="k-viewport"><canvas id="arena"></canvas></div>
            <div class="k-log" id="log"></div>
        </main>
        <aside class="k-side right">
            <div class="k-panel"><h2>Roster</h2><div id="roster"></div></div>
            <div class="k-panel"><h2>Agent stats</h2><div id="agent-stats">—</div></div>
            <div class="k-panel"><h2>Observation (focused)</h2><canvas id="obs-canvas" width="320" height="70"></canvas></div>
            <div class="k-panel"><h2>Action mask</h2><div id="mask-row"></div></div>
            <div class="k-panel">
                <h2>Reward</h2>
                <div id="reward-nums">Red 0.0 / Blue 0.0</div>
                <canvas id="reward-canvas" width="320" height="90"></canvas>
            </div>
        </aside>
    </div>

    <footer class="k-statusbar">
        <span id="status">ready</span>
        <span class="k-spacer"></span>
        <span class="dim">left-click a unit: focus · right-drag: orbit · middle-drag: pan · wheel: zoom</span>
    </footer>

    <script src="/lib/bot_aim.js"></script>
    <script type="module" src="/app/main.js"></script>
</body>
</html>
