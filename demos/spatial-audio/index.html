<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Spatial Audio</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body>
    <canvas id="stage"></canvas>

    <!-- Left: where you are and what the world is doing to what you hear. -->
    <div class="k-hud" id="hud">
        <div class="zone" id="zoneLabel">---</div>
        <div class="k-val pos" id="posLabel">0.0, 0.0, 0.0</div>
        <div class="k-panel">
            <h2>Zone mix <span class="dim">bus gain crossfade</span></h2>
            <div id="busStrips" class="k-col"></div>
        </div>
        <div class="k-panel">
            <h2>Occlusion <span class="dim">rays to each source</span></h2>
            <div class="k-kv" id="occList"></div>
        </div>
    </div>

    <!-- Right: the listener's head model. H hides it. -->
    <div class="k-hud right" id="panel">
        <div class="k-panel">
            <h2>Head model</h2>
            <div id="headParams" class="k-col"></div>
        </div>
    </div>
    <button id="panelToggle" class="small">H show panel</button>

    <div class="help" id="help">WASD move &middot; Space up &middot; C / Ctrl down &middot; drag to look &middot; H toggle panel</div>

    <script type="module" src="/app/main.js"></script>
</body>
</html>
