<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Satellite</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  #title { color: #9fd6ff; letter-spacing: 1.2px; text-transform: uppercase; font-size: 12px; }
  #face { display: block; margin: 8px auto 0; border-radius: 8px; background: #0b0d12; cursor: crosshair; }
  #stats { padding: 6px var(--k-pad); }
  #log { margin: 0 10px; background: var(--k-surface); border-radius: 6px; font-size: 10px; }
  #log > div { padding: 0; border-bottom: none; }
  .k-statusbar button { flex: 1; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1 id="title">Satellite</h1>
    <span class="k-sub" id="sub">independent realm · own timers</span>
  </header>
  <canvas id="face" width="240" height="150"></canvas>
  <div id="stats"></div>
  <div id="log" class="k-log"></div>
  <footer class="k-statusbar">
    <button id="ping">Ping parent</button>
    <button id="bye">Close me</button>
  </footer>
  <script type="module" src="child.js"></script>
</body>
</html>
