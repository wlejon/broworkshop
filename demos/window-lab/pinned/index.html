<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pinned Card</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  /* Borderless, so the card draws its own frame. */
  body { border: 1px solid var(--k-warn); border-radius: 10px; }
  .k-header { padding: 8px 12px; }
  .k-header h1 { font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--k-warn); }
  #state { flex: 1; padding: 4px 12px; font-size: 11px; overflow: auto; }
  .k-statusbar { padding: 6px 12px; gap: 6px; }
  .k-statusbar button { flex: 1; padding: 4px; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Pinned Card</h1>
    <span class="k-sub">every value below came from pinned/bro.json</span>
  </header>
  <div id="state"></div>
  <footer class="k-statusbar">
    <button id="report">Report to host</button>
    <button id="bye">Close</button>
  </footer>
  <script type="module" src="pinned.js"></script>
</body>
</html>
