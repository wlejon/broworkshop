<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kokoro Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span id="brand">⬡ Kokoro&nbsp;Lab</span>
      <span class="tagline">steer a voice through the space, watch it take shape</span>
      <span class="grow"></span>
      <span id="backend" class="badge">loading…</span>
    </header>

    <section id="controls">
      <label class="cfg">data
        <input id="data-root" type="text" value="D:/projects/brosoundml">
      </label>
      <button id="btn-browse-data" class="iconbtn"
              title="Choose a data source — brosoundml-data (HF dataset), a brosoundml repo, or a Kokoro model dir">📁</button>
      <span id="data-meta" class="meta"></span>
      <span class="grow"></span>
      <button id="btn-reload" title="Re-detect the data source and reload">↺ Reload</button>
    </section>

    <!-- voice selection: the "selected voice" is now a point in style space -->
    <section id="voicebar">
      <label class="cfg">seed
        <select id="source" title="Jump the sliders to a known voice"></select>
      </label>
      <button id="btn-random" title="Random voice (in-distribution)">🎲 random</button>
      <button id="btn-neutral" title="Reset to the neutral centroid voice">○ neutral</button>
      <span class="grow"></span>
      <label class="cfg">clone
        <input id="ref-wav" type="text" placeholder="path to a reference .wav"
               title="Clone a real clip into the slider space via the bridge">
      </label>
      <button id="btn-browse-wav" class="iconbtn" title="Choose a reference .wav">📁</button>
      <label class="cfg">qwen
        <input id="qwen-dir" type="text" placeholder="(auto from data source)"
               title="Qwen3-TTS Base dir — the ECAPA speaker encoder clone needs. Defaults beside the data source; override to use a HuggingFace download (Qwen/Qwen3-TTS-12Hz-0.6B-Base).">
      </label>
      <button id="btn-browse-qwen" class="iconbtn" title="Choose a Qwen3-TTS Base dir">📁</button>
      <button id="btn-clone" title="ECAPA x-vector → bridge → style → sliders">⤓ clone</button>
      <span id="voice-meta" class="meta"></span>
    </section>

    <section id="sliders"></section>

    <section id="prompt">
      <input id="text" type="text" value="Hello there. This is a test of the pipeline."
             placeholder="Type something to speak…">
      <button id="btn-run" disabled>▶ Run</button>
      <button id="btn-play" disabled title="Play the synthesized audio">♪ Play</button>
      <button id="btn-save" disabled title="Save the current voice as a .bin pack">⤓ save voice</button>
      <span id="run-meta" class="meta"></span>
      <span id="pin" class="meta pin" style="display:none"></span>
      <span class="grow"></span>
      <span id="sel-label" class="meta"></span>
    </section>

    <main id="stages"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
