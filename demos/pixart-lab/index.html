<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PixArt Lab</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  :root { --k-side-w: 380px; --k-accent: #9a7fd4; }
  .k-viewport { background: #090b10; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>PixArt Lab</h1>
    <span class="k-sub">PixArt-Σ text-to-image · T5-XXL + DiT + KL-VAE</span>
    <span class="k-spacer"></span>
    <span id="backend">loading…</span>
  </header>
  <div class="k-body">
    <aside class="k-side">
      <div class="k-panel">
        <h2>model</h2>
        <div id="model"></div>
        <p class="k-note">T5-XXL resolves from <code>$BRODIFFUSION_T5_DIR</code>, a bundled
          <code>text_encoder/</code>, or a sibling <code>../t5-xxl</code>. See README.</p>
      </div>
      <div class="k-panel">
        <h2>generate</h2>
        <div id="gen"></div>
      </div>
    </aside>
    <main class="k-main">
      <div class="k-viewport">
        <canvas id="view"></canvas>
        <div class="k-hint" id="view-hint">Load a model, then Generate.</div>
      </div>
      <div class="k-toolbar" id="run"></div>
      <div class="k-toolbar bare" id="gallery"></div>
    </main>
  </div>
  <footer class="k-statusbar">
    <span id="status">idle</span>
    <span class="dim" id="timing"></span>
  </footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
