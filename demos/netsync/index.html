<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Net Sync Arena</title>
    <link rel="stylesheet" href="/lib/kit/kit.css">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body>
    <canvas id="stage"></canvas>

    <div id="hud" class="k-hud" hidden>
        <div id="status" class="dim"></div>
        <div id="scores"></div>
    </div>
    <div id="controls" class="dim" hidden>WASD / arrows to move &mdash; grab the gold pickups</div>

    <div id="lobby">
        <div class="k-panel">
            <h1>Net Sync Arena</h1>
            <p class="k-sub">bro.net.sync &mdash; high-level multiplayer demo</p>
            <button id="hostBtn" class="primary">Host game</button>
            <div class="or dim">&mdash; or join a host &mdash;</div>
            <div class="k-row joinrow">
                <input id="address" value="127.0.0.1" spellcheck="false">
                <button id="joinBtn">Join</button>
            </div>
            <div id="lobbyStatus"></div>
        </div>
    </div>

    <script type="module" src="/app/main.js"></script>
</body>
</html>
