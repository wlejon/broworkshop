<!DOCTYPE html>
<html>
<head>
    <title>HexFront</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>

    <div id="hud-top">
        <span id="hud-turn">TURN 1</span>
        <span id="hud-side" class="side-red">RED MOVES</span>
        <span id="hud-ai" style="display:none">BLUE IS MOVING&hellip;</span>
    </div>

    <div id="unit-panel" style="display:none">
        <div id="unit-name" class="panel-title"></div>
        <div class="stat-row"><span>HP</span><span id="unit-hp"></span></div>
        <div class="stat-row"><span>ATK</span><span id="unit-atk"></span></div>
        <div class="stat-row"><span>MOVE</span><span id="unit-move"></span></div>
        <div class="stat-row"><span>RANGE</span><span id="unit-range"></span></div>
        <div class="stat-row"><span>TERRAIN</span><span id="unit-terrain"></span></div>
        <div id="unit-hint" class="panel-hint"></div>
    </div>

    <div id="controls">
        <div id="btn-endturn" class="btn accent">END TURN&nbsp;<span class="key">E</span></div>
        <div id="btn-save" class="btn">SAVE&nbsp;<span class="key">S</span></div>
        <div id="btn-load" class="btn">LOAD&nbsp;<span class="key">L</span></div>
    </div>

    <div id="help">
        Click a red unit to select &middot; blue cells = move &middot; red-tinted enemies = attack
        &middot; forests/hills slow movement &middot; high ground hits +25%
    </div>

    <div id="banner" style="display:none">
        <div id="banner-text"></div>
        <div id="banner-sub">Press L to reload a save, or restart the app</div>
    </div>

    <script type="module" src="/app/app.js"></script>
</body>
</html>
