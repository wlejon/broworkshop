<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voice Pipeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Voice Pipeline</h1>
        <div id="status" class="status">choose a voice</div>
    </header>
    <main>
        <!-- Setup: choose what to load. Nothing is loaded until "Start". -->
        <section id="setup" class="setup"></section>

        <!-- Conversation: shown once models are loaded. -->
        <section id="convo" class="convo" hidden>
            <div id="transcript" class="transcript">
                <div class="hint">Say &ldquo;computer&rdquo; to activate, or hold the button (Space) to talk manually.</div>
            </div>
            <div class="meter-wrap">
                <div id="meter" class="meter"></div>
            </div>
            <button id="talk" class="talk" disabled>loading models…</button>
        </section>
    </main>
    <script src="models.js"></script>
    <script src="main.js"></script>
</body>
</html>
