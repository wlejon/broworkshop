<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ARDY Motion</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="k-app">
  <header class="k-header">
    <h1>ARDY Motion</h1>
    <span class="k-sub">bro.motion: text to Unitree G1 humanoid motion (LLM2Vec text encoder + ARDY autoregressive diffusion, 25 fps)</span>
    <span class="k-spacer"></span>
    <span id="device"></span>
  </header>
  <!-- the ARDY checkpoint (config.yaml + denoiser.safetensors) and the LLM2Vec-Llama3-8B text encoder -->
  <div class="k-toolbar" id="model-bar"></div>
  <div class="k-body">
    <main class="k-main">
      <div class="k-viewport">
        <canvas id="view"></canvas>
        <div class="k-hud right dim">left-drag orbit · middle-drag pan · wheel zoom</div>
      </div>
    </main>
    <aside class="k-side right">
      <div class="k-panel">
        <h2>Prompt</h2>
        <div class="k-stack">
          <input id="prompt" type="text" value="a person walks forward and waves" placeholder="describe a motion…" autocomplete="off">
          <div class="chips" id="chips">
            <button class="small">a person walks forward and waves</button>
            <button class="small">a person runs quickly</button>
            <button class="small">a person jumps</button>
            <button class="small">a person turns around and sits down</button>
            <button class="small">a person kicks with the right leg</button>
          </div>
        </div>
      </div>
      <div class="k-panel">
        <h2>Sampling</h2>
        <label class="k-field" title="Clip length at 25 fps (rounded to a multiple of 52)"><span>frames</span>
          <input id="frames" type="number" value="104" min="52" max="520" step="52"></label>
        <label class="k-field" title="Classifier-free guidance weight"><span>guidance</span>
          <input id="cfg" type="number" value="2.5" min="1" max="8" step="0.5"></label>
        <label class="k-field" title="DDIM denoising steps per window"><span>steps</span>
          <input id="steps" type="number" value="10" min="2" max="50" step="1"></label>
        <label class="k-field" title="Noise seed; random picks a fresh one each run"><span>seed</span>
          <input id="seed" type="number" value="0" min="0" step="1"></label>
        <label class="k-field"><input id="random-seed" type="checkbox" checked> random seed</label>
        <button id="gen" class="primary" disabled>Generate</button>
      </div>
      <div class="k-panel">
        <h2>Playback</h2>
        <div class="k-row">
          <button id="play" disabled>Pause</button>
          <label class="k-field"><input id="auto-orbit" type="checkbox" checked> auto-orbit</label>
          <label class="k-field"><input id="feet" type="checkbox" checked> foot contacts</label>
        </div>
        <label class="k-field"><span>frame</span>
          <input id="scrub" type="range" min="0" max="0" value="0" disabled>
          <span class="k-val" id="frame">—</span></label>
        <div class="k-kv" id="clip-info"></div>
      </div>
    </aside>
  </div>
  <footer class="k-statusbar"><span id="status">starting…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
