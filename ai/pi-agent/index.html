<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pi Agent</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<link rel="stylesheet" href="/lib/kit/chat.css">
<style>
  .chat { border-top: 1px solid var(--k-border); }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Pi Agent</h1>
    <span class="k-sub">a tool-using agent on a local LLM: files, bash, and JS in the live engine</span>
    <div class="k-spacer"></div>
    <span id="ctx-meter"></span>
  </header>
  <div class="k-toolbar">
    <span class="k-row" id="backend"><!-- agentBackend() builds the model row here --></span>
    <span class="k-sep"></span>
    <label class="k-field"><input type="checkbox" id="auto-approve" checked> auto-approve tools</label>
    <span class="k-sep"></span>
    <span class="dim" id="cwd"></span>
  </div>
  <main class="k-main">
    <div id="transcript" class="chat">
      <div class="chat-hint">Load a local LLM, then ask the agent to do something. It can read and write files, run bash, and eval JS against the engine.</div>
    </div>
    <div class="chat-input">
      <textarea id="prompt" rows="2" placeholder="Ask the agent to do something…  (Enter to send, Shift+Enter for a newline)"></textarea>
      <div class="k-col">
        <button id="btn-send" class="primary" disabled>Send</button>
        <button id="btn-stop" class="danger" disabled>Stop</button>
      </div>
    </div>
  </main>
  <footer class="k-statusbar"><span id="status">load a model to begin</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
