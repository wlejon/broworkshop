<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Birds</title>
<link rel="stylesheet" href="/lib/kit/kit.css">
<style>
  #photo { max-width: 100%; max-height: 100%; object-fit: contain; }
  #results { flex: none; width: 320px; }
  .hit { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--k-border); }
  .hit .p { flex: none; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .hit .sci { font-style: italic; }
</style>
</head>
<body class="k-app">
  <header class="k-header">
    <h1>Birds</h1>
    <span class="k-sub">zero-shot species ID with BioCLIP over the Upper-Midwest list</span>
  </header>
  <div class="k-toolbar">
    <button id="open" class="primary" disabled>Open photo…</button>
    <label class="k-field">model
      <select id="model"><option value="bioclip-2">BioCLIP 2</option><option value="bioclip">BioCLIP</option></select>
    </label>
    <label class="k-field"><input type="checkbox" id="crop" checked> find the animal</label>
  </div>
  <div class="k-body">
    <main class="k-main pad"><div class="k-viewport"><img id="photo"></div></main>
    <aside class="k-side" id="results"><h2>Top 5</h2><div id="hits" class="k-col"></div></aside>
  </div>
  <footer class="k-statusbar"><span id="status">starting…</span></footer>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
